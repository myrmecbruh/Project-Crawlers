              c.tile = 'shallow_water';
              shaped = true;
            }
          }
        }
      }
    }
  }

  /* ---- ramps, so every level can be reached from the one below ---------- */
  if (shaped) {
    /* Two moves can stack into a step no ramp can climb -- a pit inside a ring
       left a two-metre drop, and twenty-one squares of a flooded orcish arena
       were stranded behind it. Pull every cell down until nothing is more than
       a metre above its lowest neighbour, so a ramp can always bridge it. */
    smoothRoom(world, box);
    rampRoom(world, r, box, rand);
  }

  /* ---- and only now, the things that stand in the way ------------------- */
  for (let i = 0; i < blockMoves.length; i++) {
    shaped = blockRoom(world, r, box, rand, blockMoves[i][0], blockMoves[i][1]) || shaped;
  }

  /* ---- dressing: the floor a word lays -------------------------------- */
  for (let i = 0; i < place.words.length; i++) {
    const w = WORD(place.words[i]);
    if (!w.floor && !w.speckle) continue;
    for (let y = box.y0; y <= box.y1; y++) {
      for (let x = box.x0; x <= box.x1; x++) {
        const c = at(x, y);
        if (!c || c.slope) continue;                 /* a ramp stays a ramp */
        if (TILE(c.tile).footing === 'block') continue;
        if (c.tile === 'shallow_water') continue;    /* water was laid on purpose */
        if (w.floor) c.tile = w.floor;
        if (w.speckle && rand() < 0.16) c.tile = w.speckle;
      }
    }
    shaped = true;
  }

  return shaped;
}

/* Join the levels. Every cell that is a metre below a neighbour is a candidate
   ramp; a few of each boundary are taken, spread along it, so you have to walk
   round a ledge to get up rather than stepping up anywhere. */
function rampRoom(world, r, box, rand) {
  const at = function (x, y) { return world.at(x, y); };

  /* Label the shelves: each connected run of equal-height floor is one region.
     Ramps are then placed per PAIR of touching regions, which is the only way
     to be sure every shelf can be reached -- grouping by row put a ramp in
     every row and turned each ledge into an open slope. */
  const region = new Map();        /* square -> which shelf it belongs to */
  let next = 0;
  for (let y = box.y0; y <= box.y1; y++) {
    for (let x = box.x0; x <= box.x1; x++) {
      const c = at(x, y);
      if (!c || region.has(c)) continue;
      if (TILE(c.tile).footing === 'block') continue;
      const id = next++;
      const queue = [c];
      region.set(c, id);
      let head = 0;
      while (head < queue.length) {
        const q = queue[head++];
        for (let s = 0; s < STEPS.length; s++) {
          const nx = q.x + STEPS[s][0], ny = q.y + STEPS[s][1];
          if (nx < box.x0 || nx > box.x1 || ny < box.y0 || ny > box.y1) continue;
          const nb = at(nx, ny);
          if (!nb || nb.h !== c.h || region.has(nb)) continue;
          if (TILE(nb.tile).footing === 'block') continue;
          region.set(nb, id);
          queue.push(nb);
        }
      }
    }
  }

  /* Every candidate is a cell one metre BELOW a neighbour: stand there, slope
     toward it, and the two levels meet. The border ring counts as a region of
     its own, so a shelf can also be reached from the walkway by the wall. */
  const pairs = {};
  for (let y = box.y0; y <= box.y1; y++) {
    for (let x = box.x0; x <= box.x1; x++) {
      const c = at(x, y);
      if (!c || c.slope || TILE(c.tile).footing === 'block') continue;
      for (let s = 0; s < STEPS.length; s++) {
        const dx = STEPS[s][0], dy = STEPS[s][1];
        const nb = at(x + dx, y + dy);
        if (!nb || nb.h !== c.h + 1 || TILE(nb.tile).footing === 'block') continue;
        const hi = region.has(nb) ? region.get(nb) : 'edge';
        const id = (region.has(c) ? region.get(c) : 'edge') + '>' + hi;
        (pairs[id] || (pairs[id] = [])).push([x, y, dx, dy]);
      }
    }
  }

  const taken = new Set();         /* squares that are already a way up */
  const ids = Object.keys(pairs);
  for (let k = 0; k < ids.length; k++) {
    const list = pairs[ids[k]];
    const want = Math.max(1, Math.min(CFG.roomShapeRamps, list.length));
    let made = 0;
    for (let w = 0; w < list.length && made < want; w++) {
      /* Spread the ways up along the boundary rather than bunching them. */
      const pick = list[Math.floor((made + 0.5) * list.length / want)] || list[w];
      const x = pick[0], y = pick[1];
      const c = at(x, y);
      if (!c || c.slope || taken.has(c)) continue;
      c.slope = slopeFor(pick[2], pick[3]);
      c.tile = 'stone_ramp';
      taken.add(c);
      made++;
    }
    /* If the spread picks all landed on cells already used as ramps for another
       boundary, fall back to taking the first free one -- a shelf with no way
       up is the one thing this pass may not leave behind. */
    if (!made) {
      for (let w = 0; w < list.length; w++) {
        const x = list[w][0], y = list[w][1];
        const c = at(x, y);
        if (!c || c.slope || taken.has(c)) continue;
        c.slope = slopeFor(list[w][2], list[w][3]);
        c.tile = 'stone_ramp';
        taken.add(c);
        break;
      }
    }
  }
}

/* No cell may sit more than a metre above its lowest walkable neighbour, or a
   ramp cannot bridge them and whatever is beyond is stranded. Pulling the high
   side down preserves the shape -- a two-metre dais becomes a one-metre dais --
   where refusing the move would have thrown the whole room away. */
function smoothRoom(world, box) {
  const at = function (x, y) { return world.at(x, y); };
  for (let pass = 0; pass < 8; pass++) {
    let changed = false;
    for (let y = box.y0; y <= box.y1; y++) {
      for (let x = box.x0; x <= box.x1; x++) {
        const c = at(x, y);
        if (!c) continue;
        let low = Infinity;
        for (let s = 0; s < STEPS.length; s++) {
          const nb = at(x + STEPS[s][0], y + STEPS[s][1]);
          if (nb) low = Math.min(low, nb.h);
        }
        if (low !== Infinity && c.h > low + 1) { c.h = low + 1; changed = true; }
      }
    }
    if (!changed) return;
  }
}

/* Pillars and fallen slabs. A block goes in ONLY if the room is still whole
   with it there -- checked, one block at a time, rather than scattered and
   hoped for. A colonnade that seals off the apse is not a colonnade. */
function blockRoom(world, r, box, rand, kind, amt) {
  const at = function (x, y) { return world.at(x, y); };
  const spots = [];
  if (kind === 'pillars') {
    const gap = Math.max(2, 5 - amt);
    for (let y = box.y0 + 1; y <= box.y1 - 1; y += gap) {
      for (let x = box.x0 + 1; x <= box.x1 - 1; x += gap) spots.push([x, y]);
    }
  } else {
    const n = Math.min(Math.floor(((box.x1 - box.x0 + 1) * (box.y1 - box.y0 + 1)) * 0.04 * amt),
                       60);
    for (let i = 0; i < n; i++) {
      spots.push([box.x0 + Math.floor(rand() * (box.x1 - box.x0 + 1)),
                  box.y0 + Math.floor(rand() * (box.y1 - box.y0 + 1))]);
    }
  }

  let placed = 0;
  for (let i = 0; i < spots.length; i++) {
    const x = spots[i][0], y = spots[i][1];
    /* Never the middle. The generator uses a room's centre square as the room
       itself -- it is where a hall is aimed, and it is the square the final
       reachability sweep tests -- so a pillar standing there does not block one
       square, it deletes the whole room. That cost twenty-five tests. */
    if (x === r.cx && y === r.cy) continue;
    const c = at(x, y);
    if (!c || c.slope || TILE(c.tile).footing === 'block') continue;
    /* Never the square a ramp climbs into. A block here walls off the top of a
       ramp, and a ramp whose top is a wall is not a steep slope -- it is a
       wedge drawn against the foot of the wall, and a step the map says is
       there and is not. repairSlopes() sweeps up after everything else; this is
       the part that stops it needing to. The two halves are switched together
       by __test.slopeGuard()/slopeRepair(), so "off" means the world exactly as
       it was before any of this. */
    if (SLOPES_GUARDED && rampClimbsInto(at, x, y)) continue;
    const wasTile = c.tile, wasH = c.h;
    if (kind === 'rubble' && rand() < 0.5) {
      c.tile = 'rubble';                 /* walkable, just hard going */
      placed++;
      continue;
    }
    c.tile = 'stone_block';
    c.h = Math.max(c.h + 1, r.elev + 1);
    if (roomWhole(world, r, box)) { placed++; }
    else { c.tile = wasTile; c.h = wasH; }
  }
  return placed > 0;
}

/* Can every walkable square of this room still be reached from the doorway
   ring around its edge? This is the check that lets blocks be placed at all. */
function roomWhole(world, r, box) {
  const at = function (x, y) { return world.at(x, y); };
  let start = null;
  for (let x = r.x; x < r.x + r.w && !start; x++) {
    const c = at(x, r.y);
    if (c && TILE(c.tile).footing !== 'block') start = c;
  }
  if (!start) return false;

  const seen = new Set([start]);
  const queue = [start];
  let head = 0;
  while (head < queue.length) {
    const c = queue[head++];
    for (let s = 0; s < STEPS.length; s++) {
      const dx = STEPS[s][0], dy = STEPS[s][1];
      const n = at(c.x + dx, c.y + dy);
      if (!n || n.room !== r.index) continue;
      if (seen.has(n)) continue;
      if (!canStep(c, n, dx, dy)) continue;
      seen.add(n);
      queue.push(n);
    }
  }
  for (let y = r.y; y < r.y + r.h; y++) {
    for (let x = r.x; x < r.x + r.w; x++) {
      const c = at(x, y);
      if (!c || TILE(c.tile).footing === 'block') continue;
      if (!seen.has(c)) return false;
    }
  }
  return true;
}

/* ---- the walls of a built place ----------------------------------------- */

/* Rock that was DUG stays raw rock. Rock that closes in a room somebody made --
 * a chapel, a cistern, a gaol -- is faced with the blocks they laid, so you can
 * see at a glance which of these spaces was built and which was only found.
 *
 * Run last, after the halls are cut, so a doorway punched through the ring is
 * left as a doorway rather than being walled up again.
 */
function lineRoomWalls(world) {
  const at = function (x, y) { return world.at(x, y); };
  const faced = [];
  for (let i = 0; i < world.rooms.length; i++) {
    const r = world.rooms[i];
    /* Only places that were MADE. A mine or a quarry is a hole, not a room, and
       its walls should stay the rock they were hacked out of. */
    if (!r.place || r.place.tags.indexOf('worked') < 0) continue;
    for (let y = r.y - 1; y <= r.y + r.h; y++) {
      for (let x = r.x - 1; x <= r.x + r.w; x++) {
        const c = at(x, y);
        if (!c || c.room >= 0) continue;
        if (TILE(c.tile).footing !== 'block') continue;   /* a doorway stays open */
        /* Only the rock actually facing the room: the ring one metre out. */
        let touches = false;
        for (let s = 0; s < STEPS.length; s++) {
          const n = at(x + STEPS[s][0], y + STEPS[s][1]);
          if (n && n.room === r.index) { touches = true; break; }
        }
        if (!touches) continue;
        c.tile = 'stone_wall';
        faced.push(c);
      }
    }
  }
  return faced.length;
}
/* ==== 14-actors.js ==== */
/* Crawlers: the people in the labyrinth.
 *
 * RULE 2, and it governs everything that will ever be added here:
 *   every action roll comes from a SKILL, and every skill is derived from the
 *   SIX NATURAL ATTRIBUTES -- Might, Agility, Endurance, Presence, Intellect,
 *   Willpower. There is one framework. A new ability is a new row in the skills
 *   tab naming which attributes feed it, never a new system beside this one.
 *
 * RULE 1, and it is the whole shape of progression:
 *   a character learns by FAILING. Success teaches very little; failing teaches
 *   a lot, and failing only just teaches most of all. Nothing here contains a
 *   curve that slows progress down -- the slowdown is what HAPPENS, because a
 *   more practised crawler fails less often and so is taught less often.
 *   That is rule 1's "therefore", and it falls out rather than being imposed.
 */

/* What a crawler is, in the shared vocabulary. Creatures proper -- generated,
   tagged, rule 6 -- will describe themselves the same way. */
const CRAWLER_TAGS = ['person', 'crawler'];

/* ---- the roll ----------------------------------------------------------- */

/* ---- gear, which is twelve parts and does three things --------------------
   Gear SHIFTS an attribute (a pack makes you stronger-backed and slower), it
   BONUSES a skill (boots help you keep your feet), and some work REQUIRES it
   (you cannot build with your hands). All three go through ability() below, so
   there is still exactly one place anything is resolved (rule 2). */

function wornList(actor) {
  const out = [];
  for (let i = 0; i < SLOT_IDS.length; i++) {
    const item = actor.worn[SLOT_IDS[i]];
    if (item) out.push(item);
  }
  return out;
}

function gearAttrShift(actor, attrId) {
  let sum = 0;
  const worn = wornList(actor);
  for (let i = 0; i < worn.length; i++) {
    const pairs = GEAR(worn[i]).attr;
    for (let k = 0; k < pairs.length; k++) {
      if (pairs[k][0] === attrId) sum += pairs[k][1];
    }
  }
  return sum;
}

/* What an attribute is actually worth right now, gear included. */
function effAttr(actor, attrId) {
  return actor.attr[attrId] + gearAttrShift(actor, attrId);
}

function gearBonus(actor, skillId) {
  let sum = 0;
  const worn = wornList(actor);
  for (let i = 0; i < worn.length; i++) {
    const pairs = GEAR(worn[i]).bonus;
    for (let k = 0; k < pairs.length; k++) {
      if (pairs[k][0] === skillId) sum += pairs[k][1];
    }
  }
  return sum;
}

function carriesTag(actor, tag) {
  const worn = wornList(actor);
  for (let i = 0; i < worn.length; i++) {
    if (GEAR(worn[i]).tags.indexOf(tag) >= 0) return true;
  }
  return false;
}

/* Some work needs a tool at all. Going without is not forbidden -- it is just
   very hard, which keeps one rule instead of two. */
function toolPenalty(actor, skillId) {
  const sk = SKILL(skillId);
  if (!sk.needs_tag) return 0;
  return carriesTag(actor, sk.needs_tag) ? 0 : sk.without;
}

/* What the six attributes are worth to one skill, as a weighted average. */
function attributeBase(actor, skillId) {
  const derives = SKILL(skillId).derives;
  let total = 0, weight = 0;
  for (let i = 0; i < derives.length; i++) {
    total += effAttr(actor, derives[i][0]) * derives[i][1];
    weight += derives[i][1];
  }
  return weight ? total / weight : 0;
}

/* What is banked, fractions and all. Learning adds to this. */
function skillLevel(actor, skillId) {
  return actor.skills[skillId] || 0;
}

/* What COUNTS. Rule 10: whole pips only, so every roll is whole numbers you
   could read off a table. Practice accumulates in between and buys the next
   pip; it does not dribble into the result. */
function skillPips(actor, skillId) {
  return Math.floor(skillLevel(actor, skillId));
}

/* Talent plus practice. Practice eventually outweighs talent, which is the
   point of a game about people who come and go. */
function ability(actor, skillId) {
  return Math.round(attributeBase(actor, skillId)) * CFG.attrWeight
       + skillPips(actor, skillId) * CFG.skillWeight
       + gearBonus(actor, skillId)
       + toolPenalty(actor, skillId);
}

/* Dice. Two six-sided ones by default, which is the whole reason the numbers
   are small: 2d6 is a shape anybody already knows. Seeded, like everything. */
function roll(rand) {
  let total = 0;
  for (let i = 0; i < CFG.dice; i++) total += 1 + Math.floor(rand() * CFG.dieFaces);
  return total;
}

function learn(actor, skillId, ok, margin) {
  const current = skillLevel(actor, skillId);
  if (current >= CFG.skillCap) return 0;
  let gain;
  if (ok) {
    gain = CFG.gainWin;
  } else {
    gain = CFG.gainFail;
    if (-margin <= CFG.nearMissMargin) gain += CFG.nearMissBonus;
  }
  actor.skills[skillId] = Math.min(CFG.skillCap, current + gain);
  return gain;
}

/* One attempt at one thing. This is the ONLY way anything is ever resolved. */
function attempt(state, actor, skillId, difficulty) {
  const able = ability(actor, skillId);
  const dice = roll(state.rand);
  const total = able + dice;
  const margin = total - difficulty;
  const ok = margin >= 0;
  const gain = learn(actor, skillId, ok, margin);
  state.rolls++;
  /* Everything the roll was made of is kept, so the panel can show the sum the
     way a person at a table would read it: 4 and 2, threw 7, needed 15. */
  actor.lastRoll = {
    skill: skillId, skillName: SKILL(skillId).name,
    difficulty: difficulty, ability: able, dice: dice, total: total,
    margin: margin, ok: ok, gain: gain, tick: state.tick
  };
  return actor.lastRoll;
}

/* ---- making a crawler ---------------------------------------------------- */

function rollAttribute(rand) {
  /* Three draws averaged: most people are ordinary, a few are not. */
  const span = CFG.attrMax - CFG.attrMin;
  return Math.round(CFG.attrMin + (rand() + rand() + rand()) / 3 * span);
}

function makeActor(rand, index, name) {
  const attr = {};
  for (let i = 0; i < ATTRIBUTE_IDS.length; i++) {
    attr[ATTRIBUTE_IDS[i]] = rollAttribute(rand);
  }
  /* Rule 4: what they are wearing is on them, not in a panel. Twelve slots,
     and what turns up in each is down to the seed. */
  const worn = {};
  for (let i = 0; i < SLOT_IDS.length; i++) {
    const slot = SLOT_IDS[i];
    const choices = GEAR_IDS.filter(function (g) { return GEAR(g).slot === slot; });
    if (!choices.length) continue;
    if (rand() < CFG.gearChance) worn[slot] = choices[Math.floor(rand() * choices.length)];
  }
  return {
    index: index,
    name: name,
    attr: attr,
    skills: {},
    worn: worn,
    x: 0, y: 0,
    /* Where they are actually drawn, which lags where they ARE: a crawler walks
       from square to square rather than appearing on the next one. */
    fromX: 0, fromY: 0, moveT: 1,
    face: 0, faceTarget: 0,
    gait: Math.floor(rand() * 120),   /* so six crawlers do not march in step */
    cooldown: Math.floor(rand() * CFG.stepTicks),
    lastRoll: null, lastWork: null,
    site: -1, doing: 'idle',
    steps: 0, stumbles: 0
  };
}

function namePool() {
  return N('character.name_pool').split(',').map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length; });
}

function populate(state) {
  const w = state.world, rand = state.rand, pool = namePool();
  /* Scattered through the rooms, not heaped in one -- gathering is something
     the player should be able to watch happen. */
  const open = [];
  for (let i = 0; i < w.cells.length; i++) {
    const c = w.cells[i];
    if (c.room >= 0 && TILE(c.tile).footing === 'walk') open.push(i);
  }
  const actors = [];
  for (let i = 0; i < CFG.actorCount && open.length; i++) {
    const a = makeActor(rand, i, pool[Math.floor(rand() * pool.length)] || ('Crawler ' + (i + 1)));
    const pick = open.splice(Math.floor(rand() * open.length), 1)[0];
    a.x = w.cells[pick].x;
    a.y = w.cells[pick].y;
    actors.push(a);
  }
  return actors;
}

/* ---- moving through the labyrinth ---------------------------------------- */

/* The elevation at which a cell meets its neighbour in a given direction. A
   ramp meets one neighbour a metre higher than it meets the others; everything
   else meets all four at its own height. */
function meetHeight(cell, dx, dy) {
  const s = cell.slope;
  if ((s === SLOPE_XUP && dx === 1) || (s === SLOPE_XDN && dx === -1)
   || (s === SLOPE_YUP && dy === 1) || (s === SLOPE_YDN && dy === -1)) {
    return cell.h + 1;
  }
  return cell.h;
}

/* Two cells connect when the height where they meet agrees. That one sentence
   is the whole movement rule: flat ground joins flat ground, and a ramp is the
   only thing that joins two levels. */
function canStep(from, to, dx, dy) {
  if (TILE(to.tile).footing === 'block') return false;
  return meetHeight(from, dx, dy) === meetHeight(to, -dx, -dy);
}

/* Where the top of a cell is, for standing on. A ramp is stood on halfway up. */
function surfaceHeight(cell) {
  return cell.h + (cell.slope ? 0.5 : 0);
}

const MOVE_SKILL = 'clambering';

/* Try to move one metre. Every step onto difficult ground is a Clambering roll
   against how hard that floor is to cross -- water and rubble are genuinely
   worth failing at. */
function tryStep(state, actor, to, dx, dy) {
  actor.faceTarget = facingFor(dx, dy);
  const roll = attempt(state, actor, MOVE_SKILL, TILE(to.tile).cross);
  if (roll.ok) {
    actor.fromX = actor.x;
    actor.fromY = actor.y;
    actor.moveT = 0;              /* start the walk; the tick loop finishes it */
    actor.x = to.x;
    actor.y = to.y;
    actor.steps++;
    state.lightDirty = true;      /* whatever they are carrying moved with them */
    actor.doing = 'walking';
  } else {
    actor.stumbles++;
  }
  state.viewDirty = true;
  state.geomDirty = true;
  return roll;
}

function wander(state, actor) {
  const w = state.world;
  const here = w.at(actor.x, actor.y);
  const options = [];
  for (let i = 0; i < STEPS.length; i++) {
    const d = STEPS[i];
    const to = w.at(actor.x + d[0], actor.y + d[1]);
    if (to && canStep(here, to, d[0], d[1])) options.push({ d: d, to: to });
  }
  if (!options.length) return null;
  const choice = options[Math.floor(state.rand() * options.length)];
  return tryStep(state, actor, choice.to, choice.d[0], choice.d[1]);
}

/* A crawler's own initiative. The player is a head coach, not a hand: nothing
   here waits to be told. They pick the nearest bit of the camp that still needs
   doing, walk to it, and work at it. */
/* Where a crawler is DRAWN: part way between the square they left and the one
   they are heading for, and part way up the step if it was a ramp. */
function actorPos(state, actor) {
  const w = state.world;
  const to = w.at(actor.x, actor.y);
  const hTo = to ? surfaceHeight(to) : 0;
  if (actor.moveT >= 1) {
    return { gx: actor.x + 0.5, gy: actor.y + 0.5, h: hTo };
  }
  const from = w.at(actor.fromX, actor.fromY) || to;
  const hFrom = from ? surfaceHeight(from) : hTo;
  const t = actor.moveT;
  const e = t * t * (3 - 2 * t);        /* ease in and out of the step */
  return {
    gx: actor.fromX + (actor.x - actor.fromX) * e + 0.5,
    gy: actor.fromY + (actor.y - actor.fromY) * e + 0.5,
    h: hFrom + (hTo - hFrom) * e
  };
}

function actorStep(state, actor) {
  /* The walk plays out over several ticks, whether or not they are due to try
     another step. */
  if (actor.moveT < 1) {
    actor.moveT = Math.min(1, actor.moveT + 1 / Math.max(1, CFG.stepWalkTicks));
    state.viewDirty = true;
    state.geomDirty = true;
  }

  /* Turning happens every tick, not only on the tick they move, so a crawler
     swings round to face where they are going rather than snapping. */
  if (actor.face !== actor.faceTarget) {
    actor.face = turnToward(actor.face, actor.faceTarget,
                            (Math.PI / Math.max(1, CFG.turnTicks)));
    state.viewDirty = true;
    state.geomDirty = true;
  }
  if (actor.cooldown > 0) { actor.cooldown--; return null; }

  const camp = state.camp;
  if (!camp) { actor.cooldown = CFG.stepTicks; return wander(state, actor); }

  let site = actor.site >= 0 ? camp.sites[actor.site] : null;
  if (!site || site.built) {
    if (site) site.workers = Math.max(0, site.workers - 1);
    const next = claimSite(state, actor);
    if (next < 0) { actor.cooldown = CFG.stepTicks; actor.site = -1; return wander(state, actor); }
    actor.site = next;
    site = camp.sites[next];
    site.workers++;
  }

  /* Work from ALONGSIDE the site, not on top of it. Nobody builds a fire while
     standing in it, and a crawler drawn on the same square as a half-built
     store looks like they are standing on a crate. */
  const here = state.world.at(actor.x, actor.y);
  const away = site.field.at(here);
  if (away >= 0 && away <= 1) {
    actor.cooldown = CFG.campWorkTicks;
    actor.doing = site.cleared ? 'building' : 'clearing';
    actor.faceTarget = facingFor(site.x - actor.x, site.y - actor.y);
    return workSite(state, actor, site);
  }

  /* On the way, a crawler will stop and try to read a room they do not know.
     Nobody tells them to -- the player is a head coach. It is a Studying roll
     like any other, so failing at it teaches them (rule 1) and a place that
     will not give up its name is a place they get better at reading. */
  const study = studyHere(state, actor);
  if (study) return study;

  actor.cooldown = CFG.stepTicks;
  actor.doing = 'walking';
  const move = stepToward(state.world, here, site.field);
  if (!move) return wander(state, actor);
  return tryStep(state, actor, move.cell, move.dx, move.dy);
}

/* Is this crawler standing somewhere worth working out? A room only gives up
   what it was once somebody has read it -- the walls, the bones, what is left
   of the fittings. Three tries each and they let it lie, so a crawler with no
   head for it does not stand in a doorway forever. */
const STUDY_TRIES = 3;

function studyHere(state, actor) {
  const cell = state.world.at(actor.x, actor.y);
  if (!cell || cell.room < 0) return null;
  const room = state.world.rooms[cell.room];
  if (!room || !room.place || room.known) return null;
  if (!actor.studied) actor.studied = {};
  const tries = actor.studied[cell.room] || 0;
  if (tries >= STUDY_TRIES) return null;

  actor.studied[cell.room] = tries + 1;
  actor.cooldown = CFG.studyTicks;
  actor.doing = 'studying';
  const roll = attempt(state, actor, 'studying', CFG.studyDifficulty);
  room.studies++;
  if (roll.ok) {
    room.known = true;
    room.readBy = actor.name;
    state.viewDirty = true;
  }
  actor.lastWork = { what: 'studying', ok: roll.ok };
  return roll;
}

/* ---- describing one, for the inspector ----------------------------------- */

function describeActor(actor) {
  const attrs = ATTRIBUTE_IDS.map(function (id) {
    return { id: id, abbrev: ATTR(id).abbrev, name: ATTR(id).name,
             value: effAttr(actor, id), base: actor.attr[id],
             shift: gearAttrShift(actor, id) };
  });
  const skills = SKILL_IDS.filter(function (id) { return actor.skills[id]; })
    .map(function (id) {
      const raw = skillLevel(actor, id);
      return { id: id, name: SKILL(id).name,
               level: Math.floor(raw),
               progress: raw - Math.floor(raw),
               cap: CFG.skillCap,
               from: SKILL(id).derives.map(function (p) { return ATTR(p[0]).abbrev; }).join('+') };
    });
  const gear = SLOT_IDS.map(function (slot) {
    const item = actor.worn[slot];
    if (!item) return { slot: slot, slotName: SLOT(slot).name, empty: true };
    const g = GEAR(item);
    const effects = [];
    for (const pair of g.attr) {
      effects.push((pair[1] > 0 ? '+' : '') + pair[1] + ' ' + ATTR(pair[0]).abbrev);
    }
    for (const pair of g.bonus) {
      effects.push((pair[1] > 0 ? '+' : '') + pair[1] + ' ' + SKILL(pair[0]).name);
    }
    return { slot: slot, slotName: SLOT(slot).name, item: item, name: g.name,
             tags: g.tags.map(function (t) { return TAG(t).name; }),
             effects: effects, empty: false };
  });
  const worn = gear.filter(function (g) { return !g.empty; })
                   .map(function (g) { return g.name; });
  return {
    kind: 'crawler',
    name: actor.name,
    at: actor.x + ', ' + actor.y,
    attributes: attrs,
    skills: skills,
    worn: worn,
    gear: gear,
    lacksTool: !carriesTag(actor, 'tool'),
    lastRoll: actor.lastRoll,
    steps: actor.steps,
    stumbles: actor.stumbles,
    doing: actor.doing,
    lastWork: actor.lastWork,
    tags: CRAWLER_TAGS.map(function (t) { return TAG(t).name; })
  };
}
/* ==== 16-camp.js ==== */
/* The camp.
 *
 * The crawlers pick the biggest room they can all reach, walk to it, and put up
 * a camp: a fire first, then bedrolls, a store and windbreaks around it. Every
 * effort goes through attempt() like everything else -- clearing the ground is a
 * Labouring roll against how hard that floor is to clear, and raising a
 * structure is a Building roll against how hard the structure is. Failing at
 * either is how they get better at it.
 *
 * Nobody is told to do this. The player is a head coach; this is the crawlers'
 * own initiative.
 */

const CLEAR_SKILL = 'labouring';

/* Where things go: the fire in the middle, everything else spiralling out from
   it, so a camp reads as a camp rather than a scatter. */
function campPlan(world, room) {
  const wanted = [['campfire', 1]];
  wanted.push(['bedroll', CFG.campBedrolls]);
  wanted.push(['store', CFG.campStores]);
  wanted.push(['windbreak', CFG.campWindbreaks]);

  const taken = {};
  const sites = [];
  const cx = room.x + (room.w >> 1), cy = room.y + (room.h >> 1);

  /* Rings out from the fire, in a fixed order, so the same room always lays
     out the same camp. */
  const spots = [];
  for (let r = 0; r <= CFG.campSpread; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        spots.push([cx + dx, cy + dy]);
      }
    }
  }

  let next = 0;
  for (const [id, count] of wanted) {
    for (let k = 0; k < count; k++) {
      while (next < spots.length) {
        const [x, y] = spots[next++];
        const cell = world.at(x, y);
        if (!cell || taken[x + ',' + y]) continue;
        if (cell.room !== room.index) continue;
        if (TILE(cell.tile).footing !== 'walk') continue;
        taken[x + ',' + y] = true;
        sites.push({
          index: sites.length, structure: id, x: x, y: y,
          cleared: false, progress: 0, built: false,
          workers: 0, efforts: 0, field: null
        });
        break;
      }
    }
  }
  return sites;
}

/* Choose the room to camp in: the biggest one everybody can actually walk to.
   "Reachable" is not an assumption anywhere in this game -- it is measured. */
function chooseCampRoom(world, actors) {
  const fields = actors.map(function (a) { return reachableFrom(world, a.x, a.y); });
  let best = null;
  for (const room of world.rooms) {
    const mid = world.at(room.cx, room.cy);
    if (!mid || TILE(mid.tile).footing === 'block') continue;
    let everyone = true;
    for (const f of fields) if (f.at(mid) < 0) { everyone = false; break; }
    if (!everyone) continue;
    if (!best || room.area > best.area) best = room;
  }
  return best;
}

function makeCamp(state) {
  const room = chooseCampRoom(state.world, state.actors);
  if (!room) return null;
  const sites = campPlan(state.world, room);
  for (const s of sites) s.field = reachableFrom(state.world, s.x, s.y);
  return { room: room, sites: sites, founded: false };
}

function campSummary(camp) {
  if (!camp) return { sites: 0, built: 0, cleared: 0, progress: 0 };
  let built = 0, cleared = 0, total = 0;
  for (const s of camp.sites) {
    if (s.built) built++;
    if (s.cleared) cleared++;
    total += s.built ? 100 : s.progress;
  }
  return {
    sites: camp.sites.length, built: built, cleared: cleared,
    progress: camp.sites.length ? Math.round(total / camp.sites.length) : 0,
    done: built === camp.sites.length && camp.sites.length > 0
  };
}

/* A crawler takes the nearest unfinished site that is not already crowded. */
function claimSite(state, actor) {
  const camp = state.camp;
  if (!camp) return -1;
  const here = state.world.at(actor.x, actor.y);
  let best = -1, bestD = Infinity;
  for (const s of camp.sites) {
    if (s.built) continue;
    if (s.workers >= 2 && s.index !== actor.site) continue;
    const d = s.field.at(here);
    if (d < 0 || d >= bestD) continue;
    bestD = d; best = s.index;
  }
  return best;
}

/* One effort at one site: clear the ground, then raise the thing. */
function workSite(state, actor, site) {
  const cell = state.world.at(site.x, site.y);
  site.efforts++;
  if (!site.cleared) {
    const roll = attempt(state, actor, CLEAR_SKILL, TILE(cell.tile).clear);
    if (roll.ok) site.cleared = true;
    actor.lastWork = { site: site.index, what: 'clearing', ok: roll.ok };
    return roll;
  }
  const def = STRUCT(site.structure);
  const roll = attempt(state, actor, def.skill, def.difficulty);
  if (roll.ok) {
    site.progress = Math.min(100, site.progress + CFG.campProgress);
    if (site.progress >= 100) { site.built = true; state.viewDirty = true; state.lightDirty = true; }
    state.geomDirty = true;
  }
  actor.lastWork = { site: site.index, what: 'building', ok: roll.ok };
  return roll;
}
/* ==== 18-figure.js ==== */
/* The crawler as a real, posed, three-dimensional figure.
 *
 * Bones hang off one another; every visible part is a tapered box fixed to a
 * bone; the whole thing is turned to face where the crawler is going and posed
 * by a walk while they are going somewhere, a work swing at a site, or a slow
 * idle breath the rest of the time. It is then projected into the
 * same small buffer as everything else, which is what makes 3D read as sprite
 * work -- the geometry is real, the resolution is not.
 *
 * Rule 4 lives here: a part is drawn if it is body, or if the item it belongs
 * to is the one worn in its slot. There is no other path to the screen, and the
 * build refuses any piece of gear that no part draws.
 */

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

/* ---- just enough matrix maths ------------------------------------------ */
function matId() { return [1, 0, 0, 0, 1, 0, 0, 0, 1]; }

function matMul(a, b) {
  const o = new Array(9);
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      o[r * 3 + c] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c];
    }
  }
  return o;
}

function matVec(m, x, y, z) {
  return [m[0] * x + m[1] * y + m[2] * z,
          m[3] * x + m[4] * y + m[5] * z,
          m[6] * x + m[7] * y + m[8] * z];
}

/* X swings a limb forward and back, Y rolls it out to the side, Z turns the
   whole crawler to face somewhere. */
function matRotX(a) { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; }
function matRotY(a) { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; }
function matRotZ(a) { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; }

function poseMat(r) {
  if (!r) return matId();
  let m = matId();
  if (r[2]) m = matMul(m, matRotZ(r[2]));
  if (r[0]) m = matMul(m, matRotX(r[0]));
  if (r[1]) m = matMul(m, matRotY(r[1]));
  return m;
}

/* ---- the pose ----------------------------------------------------------- */

/* Which way a crawler faces, as an angle. Facing 0 is along +y. */
function facingFor(dx, dy) { return Math.atan2(dx, dy); }

/* Shortest way round, so a crawler turning from nearly-north to nearly-west
   does not spin the long way. */
function turnToward(from, to, by) {
  let gap = to - from;
  while (gap > Math.PI) gap -= TAU;
  while (gap < -Math.PI) gap += TAU;
  if (Math.abs(gap) <= by) return to;
  return from + Math.sign(gap) * by;
}

/* The whole animation system: three procedural clips. The SHAPE of each is
   here in code because it is logic; every AMOUNT is a knob in the spreadsheet,
   so the walk can be widened or the work slowed without touching this.
 *
 * The walk plays only while the BODY is actually going somewhere. A crawler's
 * stride takes fewer ticks than the pause before their next step, and a step
 * they fail leaves them standing where they were, so `doing === 'walking'` is
 * true for long stretches in which nothing is moving. Reading the walk off
 * `moveT` instead of off what they are up to is what stops a standing crawler
 * marching on the spot; `doing` is still the intent, so the panel goes on
 * saying what they are about. */
function poseFor(actor, tick) {
  const pose = { root: [0, 0, actor.face] };
  let bob = 0;

  if (actor.doing === 'walking' && actor.moveT < 1) {
    const t = ((tick + actor.gait) % CFG.walkTicks) / CFG.walkTicks * TAU;
    /* Eased in and out across the step, so the legs come to rest with the body
       instead of being left half way through a stride to snap back from. */
    const ease = Math.sin(Math.PI * actor.moveT);
    const swing = Math.sin(t) * CFG.walkLegSwing * DEG * ease;
    const arm = Math.sin(t) * CFG.walkArmSwing * DEG * ease;
    pose.thigh_l = [swing, 0, 0];
    pose.thigh_r = [-swing, 0, 0];
    /* A knee only ever folds one way. */
    pose.knee_l = [-Math.max(0, Math.sin(t - 0.7)) * CFG.walkKneeBend * DEG * ease, 0, 0];
    pose.knee_r = [-Math.max(0, Math.sin(t + Math.PI - 0.7)) * CFG.walkKneeBend * DEG * ease, 0, 0];
    pose.shoulder_l = [-arm, 0, 0];
    pose.shoulder_r = [arm, 0, 0];
    pose.elbow_l = [-Math.abs(arm) * 0.6, 0, 0];
    pose.elbow_r = [-Math.abs(arm) * 0.6, 0, 0];
    bob = Math.abs(Math.sin(t)) * CFG.walkBob * ease;

  } else if (actor.doing === 'clearing' || actor.doing === 'building') {
    const t = ((tick + actor.gait) % CFG.workTicks) / CFG.workTicks * TAU;
    /* Up slowly, down fast: a swing, not a wave. */
    const lift = (Math.cos(t) * 0.5 + 0.5);
    const raise = -lift * CFG.workArmLift * DEG;
    pose.shoulder_l = [raise, 0, 0];
    pose.shoulder_r = [raise, 0, 0];
    pose.elbow_l = [-lift * 0.5, 0, 0];
    pose.elbow_r = [-lift * 0.5, 0, 0];
    pose.chest = [(1 - lift) * CFG.workLean * DEG, 0, 0];
    pose.thigh_l = [-6 * DEG, 0, 0];
    pose.thigh_r = [6 * DEG, 0, 0];
    pose.knee_l = [-4 * DEG, 0, 0];
    pose.knee_r = [-10 * DEG, 0, 0];
    bob = -lift * 0.02;

  } else {
    /* Standing about, which now includes the pause between two steps. */
    const t = ((tick + actor.gait) % CFG.idleTicks) / CFG.idleTicks * TAU;
    const sway = Math.sin(t) * CFG.idleSway * DEG;
    pose.chest = [sway * 0.4, sway, 0];
    pose.head = [-sway * 0.3, -sway * 0.5, 0];
    pose.shoulder_l = [0, -sway, 0];
    pose.shoulder_r = [0, -sway, 0];
    bob = Math.sin(t * 2) * 0.006;
  }

  return { rot: pose, bob: bob };
}

/* ---- the skeleton ------------------------------------------------------- */

/* Every bone's place and facing in the crawler's own space, root at the feet.
   Parents first, which the spreadsheet guarantees by ordering and the build
   guarantees by refusing a loop. */
function buildSkeleton(pose) {
  const out = {};
  for (let i = 0; i < BONE_IDS.length; i++) {
    const id = BONE_IDS[i], b = DATA.bones[id];
    const local = poseMat(pose.rot[id]);
    if (!b.parent) {
      out[id] = { m: local, p: [b.x, b.y, b.z + pose.bob] };
      continue;
    }
    const up = out[b.parent];
    if (!up) { out[id] = { m: local, p: [b.x, b.y, b.z] }; continue; }
    const off = matVec(up.m, b.x, b.y, b.z);
    out[id] = { m: matMul(up.m, local),
                p: [up.p[0] + off[0], up.p[1] + off[1], up.p[2] + off[2]] };
  }
  return out;
}

/* Which parts are on this crawler right now. */
function figureParts(actor) {
  const out = [];
  for (let i = 0; i < FIGURE_IDS.length; i++) {
    const id = FIGURE_IDS[i], f = DATA.figure[id];
    if (f.slot === 'body' || actor.worn[f.slot] === f.item) out.push({ id: id, part: f });
  }
  return out;
}

/* ---- one part, as a lathed shape --------------------------------------- *
 * A part is a stack of rings. Each ring is a `sides`-sided loop; the stack runs
 * from from_m to to_m along the bone. Between the ends the width and depth
 * interpolate, `bulge` swells the middle, and cap_top / cap_bot round the last
 * fraction off along a circle so a head domes and a hand is not a brick.
 *
 * Four sides and two rings is exactly the tapered box this replaced, so nothing
 * was lost -- there is just somewhere to go now.
 */
function partMesh(bone, f, scale) {
  const sides = f.sides, rings = f.rings;
  const verts = new Array(rings * sides);
  const radius = new Array(rings);

  for (let r = 0; r < rings; r++) {
    const t = rings === 1 ? 0 : r / (rings - 1);
    const z = (f.from_m + (f.to_m - f.from_m) * t) * scale;
    let w = (f.w_bot + (f.w_top - f.w_bot) * t) * scale;
    let dd = (f.d_bot + (f.d_top - f.d_bot) * t) * scale;

    /* A body is not a cone: it swells between its ends. */
    const swell = 1 + f.bulge * Math.sin(Math.PI * t);
    w *= swell; dd *= swell;

    /* Round the ends off along a circle rather than cutting them flat. */
    if (f.cap_bot > 0 && t < f.cap_bot) {
      const u = 1 - t / f.cap_bot;
      const k = Math.sqrt(Math.max(0, 1 - u * u));
      w *= k; dd *= k;
    }
    if (f.cap_top > 0 && t > 1 - f.cap_top) {
      const u = (t - (1 - f.cap_top)) / f.cap_top;
      const k = Math.sqrt(Math.max(0, 1 - u * u));
      w *= k; dd *= k;
    }
    radius[r] = Math.max(w, dd);

    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * TAU;
      const v = matVec(bone.m,
                       Math.cos(a) * w + f.ox * scale,
                       Math.sin(a) * dd + f.oy * scale,
                       z);
      verts[r * sides + i] = [bone.p[0] * scale + v[0],
                              bone.p[1] * scale + v[1],
                              bone.p[2] * scale + v[2]];
    }
  }

  /* Faces, wound so the cross product points outwards. */
  const faces = [];
  for (let r = 0; r < rings - 1; r++) {
    for (let i = 0; i < sides; i++) {
      const j = (i + 1) % sides;
      faces.push([r * sides + i, r * sides + j,
                  (r + 1) * sides + j, (r + 1) * sides + i]);
    }
  }
  /* Only cap an end that is actually open. A rounded end closes itself. */
  const EPS = 1e-4;
  if (radius[rings - 1] > EPS) {
    const top = [];
    for (let i = 0; i < sides; i++) top.push((rings - 1) * sides + i);
    faces.push(top);
  }
  if (radius[0] > EPS) {
    const bot = [];
    for (let i = sides - 1; i >= 0; i--) bot.push(i);
    faces.push(bot);
  }
  return { verts: verts, faces: faces };
}
/* ==== 20-input.js ==== */
/* Keyboard, mouse and touch all write the same state, so the game never learns
   which device it came from. Drag pans, wheel or pinch zooms, hover or tap
   inspects. */
const KEYMAP = {
  ArrowUp: 'panUp', KeyW: 'panUp',
  ArrowDown: 'panDown', KeyS: 'panDown',
  ArrowLeft: 'panLeft', KeyA: 'panLeft',
  ArrowRight: 'panRight', KeyD: 'panRight'
};

const DRAG_SLOP = 4;   /* px of movement before a tap becomes a drag */

/* Turning and tilting are not panning, so they get their own keys. Q and E
   swing a quarter turn the way Final Fantasy Tactics does; R raises the angle. */
const VIEW_KEYS = {
  KeyQ: (s) => rotateCamera(s, -1),
  KeyE: (s) => rotateCamera(s, 1),
  KeyR: (s) => tiltCamera(s),
  Space: (s) => setPaused(s),
  Comma: (s) => setSpeed(s, s.speed - 1),
  Period: (s) => setSpeed(s, s.speed + 1)
};

function bindInput(state, canvas, toBuffer) {
  const drag = { active: false, moved: 0, lastX: 0, lastY: 0, id: null, pick: -1 };
  const pinch = { active: false, start: 0, zoom: 1 };

  function key(e, down) {
    if (down && VIEW_KEYS[e.code] && !e.repeat) {
      VIEW_KEYS[e.code](state);
      if (typeof Game !== 'undefined' && Game.refreshControls) Game.refreshControls();
      e.preventDefault();
      return;
    }
    const slot = KEYMAP[e.code];
    if (!slot) return;
    state.input[slot] = down;
    e.preventDefault();
  }
  addEventListener('keydown', (e) => key(e, true));
  addEventListener('keyup', (e) => key(e, false));

  function track(e) {
    const b = toBuffer(e.clientX, e.clientY);
    state.pointer.over = true;
    state.pointer.bx = b.x;
    state.pointer.by = b.y;
    state.pointer.clientX = e.clientX;
    state.pointer.clientY = e.clientY;
  }

  /* Any real movement of the pointer means the player is aiming again. */
  function stirred() {
    if (!state.pointer.quiet) return;
    state.pointer.quiet = false;
    state.viewDirty = true;
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch' && pinch.active) return;
    drag.active = true; drag.moved = 0;
    drag.lastX = e.clientX; drag.lastY = e.clientY; drag.id = e.pointerId;
    track(e);
    /* Read what is under the finger NOW, at the press, and select that on
       release. Crawlers walk, so a hundred milliseconds of click is long
       enough for one to slide away and leave you holding the rock behind
       them. What you aimed at is what you pressed on. */
    drag.pick = Render.pickAt(state, state.pointer.bx, state.pointer.by);
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    const moved = Math.abs(e.clientX - state.pointer.clientX)
                + Math.abs(e.clientY - state.pointer.clientY);
    track(e);
    if (moved > 0) stirred();
    if (!drag.active || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.lastX, dy = e.clientY - drag.lastY;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved > DRAG_SLOP) {
      const a = toBuffer(drag.lastX, drag.lastY);
      const b = toBuffer(e.clientX, e.clientY);
      panCamera(state, a.x - b.x, a.y - b.y);
    }
    drag.lastX = e.clientX; drag.lastY = e.clientY;
  });

  function endDrag(e) {
    if (!drag.active) return;
    /* A press that did not travel is a tap: inspect whatever is under it. */
    if (drag.moved <= DRAG_SLOP) {
      state.selected = drag.pick;
      setFollow(state, state.selected);
      /* Selecting a crawler locks the view onto them, which slides the world
         under the pointer. Whatever ends up there was not pointed at. */
      state.pointer.quiet = true;
      state.viewDirty = true;
    }
    drag.active = false; drag.id = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', (e) => {
    if (e.pointerType !== 'touch') {
      state.pointer.over = false;
      state.hover = -1;
      state.viewDirty = true;
    }
  });

  canvas.addEventListener('wheel', (e) => {
    const b = toBuffer(e.clientX, e.clientY);
    setZoom(state, state.cam.zoom + (e.deltaY < 0 ? 1 : -1), b.screenX, b.screenY);
    e.preventDefault();
  }, { passive: false });

  /* Two fingers zoom. One finger is already panning. */
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 2) return;
    pinch.active = true;
    drag.active = false;
    pinch.start = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    pinch.zoom = state.cam.zoom;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (!pinch.active || e.touches.length !== 2) return;
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    if (pinch.start > 0) setZoom(state, pinch.zoom * (d / pinch.start));
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pinch.active = false;
  });
}
/* ==== 30-sim.js ==== */
/* One fixed step. Deterministic: same seed and same inputs, same result.
   Nothing in here reads the clock or Math.random.

   Note what is NOT here: the camera. Panning is what makes time run, so if the
   simulation moved the camera, time would wind itself forward for ever. */
function step(state) {
  for (let i = 0; i < state.actors.length; i++) actorStep(state, state.actors[i]);
  state.tick++;
}
/* ==== 40-render.js ==== */
/* The isometric view, drawn pixel for pixel.
 *
 * THE SCALE IS LOCKED: one metre of height is render.rise game pixels, always.
 * Zooming does not make the world bigger -- it makes each game pixel cover more
 * real screen pixels, by a whole number, and the picture is drawn smaller to
 * match. So every edge lands on a whole pixel at every zoom, and a crawler is
 * the same 52 pixels tall whether you are close in or far out.
 *
 * A builder with no consumer looks exactly like working code. So build() fills
 * `batch`, draw() paints it AND records `consumed` -- what actually reached the
 * buffer -- and every test asserts against `consumed`, never against `batch`.
 */
/* Two shapes sharing an edge are not covering each other, and the edge is not
 * exact: a square's own outline is antialiased over the pixel it lands in. So a
 * contact thinner than this many pixels counts as the two merely touching. */
const COVER_EPS = 0.5;

/* Which of a material's pictures a surface wears is folded down from the
 * square's coordinates and one of these, so the same square always picks the
 * same picture and two surfaces standing on it need not agree: a block's left
 * side, its right side, and the ground it stands on are three different surfaces
 * and are salted apart. See Render.pickFor(). */
const PICK_GROUND = 1, PICK_LEFT = 2, PICK_RIGHT = 3;

const Render = {
  w: 0, h: 0,                  /* the picture, in game pixels              */
  buf: null, bctx: null,
  /* The pick buffer: the scene painted flat in identity colours. The game no
     longer reads it -- pickAt() works the answer out arithmetically -- but the
     battery still paints it as the yardstick the arithmetic answer is proved
     against, so it is built and sized like any other buffer. */
  pick: null, pctx: null,
  batch: [],
  consumed: null,
  recordItems: false,
  /* Paint only the part of a side wall that stands above the block standing in
     front of it. Flipped off only by the test that paints one frame both ways
     and compares the two pictures pixel for pixel. */
  clipWalls: true,
  /* Paint a crawler part way through a step after the whole of the ground that
     step covers, so the ground can never paint over their legs. Flipped off
     only by the test that walks one stride both ways and counts how many of the
     crawler's own pixels the ground covers. */
  stepGround: true,
  /* Lay each material ON the ground it lies on, in the ground's own plane,
     instead of pasting it flat across the screen. Flipped off only by the tests
     that paint one frame both ways: pasting it flat is how the picture used to
     be made, and the old way is kept as the yardstick the mapped way is proved
     against. See ground().

     Named for what is ON, not for what goes away, so that reading the flag and
     reading the code below it cannot disagree: on means mapped. */
  mappedGround: true,
  /* Lay each material on the SIDES of a block too, in the face's own plane,
     instead of leaving them flat colour. Flipped off only by the tests that
     paint one frame both ways: flat sides are how the picture used to be made,
     and the old way is kept as the yardstick the mapped way is proved against.
     See wall().

     Named for what is ON, like mappedGround. */
  mappedWalls: true,
  /* Compose each material out of the pictures somebody dropped into
     textures/<material>/ instead of generating it. On means a dropped-in
     picture IS the surface; off means the generated tile, which is the way the
     game looked before anybody dropped one in.
     
     Flipped off only by the test that paints one frame both ways and compares
     the two pictures -- a builder with no consumer looks exactly like working
     code, and so does a folder somebody has put pictures in. Named for what is
     ON, like mappedGround. */
  pictures: true,
  /* A square of ground may only skip its own placement while the pattern still
     carries THAT floor's plane. A ramp at the same height is mapped from its own
     sloped corners and shares the pattern, so it takes the plane away from every
     square laid after it -- which is what put a floor square's picture down
     3x taller along one edge, in a run, wherever a ramp was drawn first.
     Flipped off only by the test that paints one frame each way and counts:
     skipping on the stamp alone is how it was, and the skew it leaves is the
     yardstick this is proved against.

     Named for what is ON, like mappedGround. */
  ownPlane: true,
  _xformSeq: 0,                /* bumped by anything that sets a transform  */
  /* Work out what a selected thing is standing in front of by BOX overlap --
     what the game did until v0.25.0, and what it did wrongly: two floor squares
     a step apart on screen share half their boxes and no picture at all, so
     selecting one made the other go see-through. Left here as the yardstick the
     exact test is proved against, in one build, by the tests that count both
     ways. See painted() and occludes(). */
  fadeBox: false,
  planes: {},                  /* floor height -> its ground plane, this frame */
  cellAt: null,                /* world square -> its place in the batch (Map) */
  alphaPlan: null,             /* how strong each thing painted, this frame   */

  resize(w, h) {
    w = Math.max(64, Math.round(w));
    h = Math.max(48, Math.round(h));
    if (this.buf && this.w === w && this.h === h) return false;
    this.w = w; this.h = h;
    if (!this.buf) {
      this.buf = document.createElement('canvas');
      this.pick = document.createElement('canvas');
      this.bctx = this.buf.getContext('2d', { alpha: false });
      this.pctx = this.pick.getContext('2d', { alpha: false, willReadFrequently: true });
    }
    this.buf.width = w; this.buf.height = h;
    this.pick.width = w; this.pick.height = h;
    return true;
  },

  ensure() {
    if (!this.buf) this.resize(CFG.maxBufW, CFG.maxBufH);
    if (!this.patCache) this.patCache = {};
    if (!this.mats) this.mats = {};
    if (!this.pics) this.pics = {};
  },

  /* Throw away every material baked so far: the generated tiles, the tiles
     composed from dropped-in pictures, and every shaded pattern of either.
     
     Called when the pictures finish decoding -- everything baked before them was
     baked without them -- and by the tests that paint one frame each way. */
  forgetMaterials() {
    this.mats = {};
    this.pics = {};
    this.patCache = {};
  },

  /* Will this material be a picture rather than a generated tile? Asked once per
     square of ground and twice per block in a frame, so it counts nothing and
     does no work. */
  drawn(name) {
    return !!(this.pictures && name && Textures.live[name]);
  },

  /* ---- masonry -----------------------------------------------------------
   * A wall somebody BUILT, as opposed to rock somebody dug through: irregular
   * blocks, big ones packed among small ones, with the joints between them
   * showing dark.
   *
   * It is an OVERLAY -- dark lines along the joints and a small
   * shade delta per stone -- so it works over any colour at any light level and
   * goes through the same cached-pattern path. It is generated, not painted,
   * and seeded, so the same wall comes back every time.
   *
   * It TILES: course heights are chosen to sum exactly to the tile height and
   * each course's stones to sum exactly to its width, so there is no seam to
   * find. A wall is a metre of pattern repeated, and a metre is 32 pixels.
   */
  /* ---- the materials -----------------------------------------------------
   * Every surface in the labyrinth is GENERATED, not painted, and every one of
   * them is a transparent OVERLAY a metre square: dark where the stone is cut,
   * light where it catches, nothing where the base colour should show. One
   * tile is one square metre, so a material lands ON the grid rather than
   * floating over it.
   *
   * The look follows the standard dark-fantasy tile vocabulary -- flagstone,
   * cobble, dirt, moss, rubble, bone, water, raw rock -- and the rule that
   * makes such a set hang together: ONE LOCKED PALETTE, so anything you put
   * down belongs with everything else. The tiles tab holds that palette; these
   * only cut the shapes.
   */
  matTile(name) {
    if (this.mats[name]) return this.mats[name];
    const px = Math.max(8, Math.round(CFG.patternPx));
    const rand = makeRand(CFG.texSeed + name.length * 977 + 31);
    const c = document.createElement('canvas');
    c.width = px; c.height = px;
    const g = c.getContext('2d');
    const dark = (a) => 'rgba(16,13,11,' + Math.max(0, a).toFixed(3) + ')';
    const pale = (a) => 'rgba(255,250,238,' + Math.max(0, a).toFixed(3) + ')';
    /* a rectangle drawn three times across, so nothing is cut by the seam */
    const wrapRect = (x, y, w, h, fill) => {
      g.fillStyle = fill;
      for (let k = -1; k <= 1; k++) g.fillRect(x + k * px, y, w, h);
    };
    const speck = (n, size, fill) => {
      g.fillStyle = fill;
      for (let i = 0; i < n; i++) {
        const sx = Math.floor(rand() * px), sy = Math.floor(rand() * px);
        const w = 1 + Math.floor(rand() * size);
        g.fillRect(sx, sy, w, 1 + Math.floor(rand() * size));
        if (sx + w > px) g.fillRect(sx - px, sy, w, 1);
      }
    };

    if (name === 'masonry') { this.mats[name] = this.matMasonry(px, rand); return this.mats[name]; }

    if (name === 'flagstone') {
      /* Big cut slabs, laid square and worn at the edges. The joints are the
         whole read at this size, so they are the only strong marks. */
      const cut = [0, Math.round(px * 0.5)];
      const rows = [0, Math.round(px * 0.52)];
      for (const y of rows) {
        const off = y ? Math.round(px * 0.27) : 0;
        for (const x of cut) {
          const sx = x + off;
          wrapRect(sx, y, 1, Math.round(px * 0.5), dark(0.30));   /* the joint */
          wrapRect(sx + 1, y + 1, Math.round(px * 0.5) - 2, 1, pale(0.05));
        }
        g.fillStyle = dark(0.30); g.fillRect(0, y, px, 1);
      }
      speck(14, 2, dark(0.10));
      speck(8, 1, pale(0.07));

    } else if (name === 'rock') {
      /* Natural rock somebody hacked through -- the face you get when a hall is
         cut: no courses and no joints, just a mottled, gritty stone.
       *
       * It is built at THREE SCALES, and it needs all three. What stood here
       * was thirty wandering one-pixel cracks and nothing else, and at a metre
       * to the tile that is a fifth of the surface covered in hairlines: it
       * reads as hatching, a drawn shade, rather than as stone. Real rock has
       * no lines in it -- it has grain, lumps, and the odd split.
       *
       *   1. GRAIN -- a dense dust of single pixels both ways. This is what
       *      makes it read as stone rather than as a painted tone, and it is
       *      the part you notice when you are close to the wall.
       *   2. MOTTLING -- soft clumps of that grain, dark and light, so the
       *      surface has lumps and hollows instead of an even tone. Clumps
       *      again, never circles: a circle is the one shape stone does not
       *      make, and evenly spaced rounds read as polka dots.
       *   3. CREVICES -- a HANDFUL of short dark splits. Only a handful. The
       *      count is the whole difference between cracked stone and a hatch.
       *
       * All of it is isotropic on purpose: this material goes on the ground a
       * block stands on AND on the sides of the block, and unlike masonry it
       * has no grain direction that could be turned the wrong way on one of
       * them. */
      speck(96, 1, dark(0.06));
      speck(72, 1, pale(0.06));
      for (let i = 0; i < 16; i++) {
        const bx = rand() * px, by = rand() * px;
        const n = 5 + Math.floor(rand() * 12);
        const lit = rand() < 0.45;
        g.fillStyle = lit ? pale(0.11) : dark(0.12);
        for (let k = 0; k < n; k++) {
          const ox = Math.round(bx + (rand() - 0.5) * 11);
          const oy = Math.round(by + (rand() - 0.5) * 11);
          const w = 1 + Math.floor(rand() * 3), h = 1 + Math.floor(rand() * 3);
          for (let q = -1; q <= 1; q++) g.fillRect(ox + q * px, oy, w, h);
        }
      }
      for (let i = 0; i < 6; i++) {
        let x = rand() * px, y = rand() * px;
        const a = rand() * Math.PI * 2;
        let dx = Math.cos(a), dy = Math.sin(a);
        const steps = 3 + Math.floor(rand() * (px * 0.22));
        for (let k = 0; k < steps; k++) {
          g.fillStyle = dark(0.20 + rand() * 0.06);
          const sx = ((Math.round(x) % px) + px) % px, sy = ((Math.round(y) % px) + px) % px;
          for (let q = -1; q <= 1; q++) g.fillRect(sx + q * px, sy, 1, 1);
          /* the split wanders as it runs, the way a crack in stone does */
          if (rand() < 0.35) { const t = dx; dx = dy * (rand() < 0.5 ? 1 : -1); dy = t; }
          x += dx; y += dy;
        }
      }

    } else if (name === 'dirt') {
      /* Trodden earth: clods and small stones, no structure at all. */
      speck(46, 3, dark(0.13));
      speck(26, 2, pale(0.07));
      for (let i = 0; i < 7; i++) {                     /* the odd pebble */
        const x = Math.floor(rand() * px), y = Math.floor(rand() * px);
        wrapRect(x, y, 2, 2, pale(0.13));
        wrapRect(x, y + 2, 2, 1, dark(0.18));
      }

    } else if (name === 'moss') {
      /* Growth taking a floor back. A blotch is a CLUMP of little squares, not
         a circle: drawn as circles they came out as evenly spaced polka dots,
         which is the one shape nothing organic makes. */
      for (let i = 0; i < 22; i++) {
        const bx = rand() * px, by = rand() * px;
        const n = 4 + Math.floor(rand() * 10);
        g.fillStyle = rand() < 0.55 ? dark(0.15) : pale(0.09);
        for (let k = 0; k < n; k++) {
          const ox = Math.round(bx + (rand() - 0.5) * 7);
          const oy = Math.round(by + (rand() - 0.5) * 6);
          const w = 1 + Math.floor(rand() * 3), h = 1 + Math.floor(rand() * 2);
          for (let q = -1; q <= 1; q++) g.fillRect(ox + q * px, oy, w, h);
        }
      }
      speck(34, 2, dark(0.11));

    } else if (name === 'water') {
      /* Standing water: a few long soft ripples, not a scratchy hatch. Drawn
         every other row it read as scored lines rather than a surface. */
      for (let i = 0; i < 9; i++) {
        const y = Math.floor(rand() * px);
        const w = px * (0.25 + rand() * 0.45);
        const x = rand() * px;
        wrapRect(Math.round(x), y, Math.round(w), 1,
                 rand() < 0.55 ? pale(0.07) : dark(0.05));
      }
      /* and the odd bright catch where it moves */
      for (let i = 0; i < 5; i++) {
        const x = Math.floor(rand() * px), y = Math.floor(rand() * px);
        wrapRect(x, y, 1 + Math.floor(rand() * 3), 1, pale(0.16));
      }

    } else if (name === 'rubble') {
      /* Collapse: angular pieces at every size, piled without order. */
      for (let i = 0; i < 34; i++) {
        const x = Math.floor(rand() * px), y = Math.floor(rand() * px);
        const w = 2 + Math.floor(rand() * 5), h = 2 + Math.floor(rand() * 4);
        wrapRect(x, y, w, h, rand() < 0.5 ? dark(0.16) : pale(0.09));
        wrapRect(x, y + h, w, 1, dark(0.22));          /* its shadow */
      }

    } else if (name === 'bones') {
      /* Somebody else got this far: pale splinters on a dark floor. */
      speck(30, 2, dark(0.14));
      for (let i = 0; i < 16; i++) {
        const x = Math.floor(rand() * px), y = Math.floor(rand() * px);
        const len = 2 + Math.floor(rand() * 5);
        if (rand() < 0.5) wrapRect(x, y, len, 1, pale(0.30));
        else wrapRect(x, y, 1, len, pale(0.26));
        wrapRect(x, y + 1, len, 1, dark(0.12));
      }
    }

    this.mats[name] = c;
    return c;
  },

  matMasonry(px, rand) {
    const pick = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));

    /* Build the wall as a MODEL first, then draw it. The first version walked
       the randomness twice -- once to shade the stones, once to place the
       joints -- and the two walks drifted apart, so the joints did not land on
       the stones. One model, drawn once, cannot disagree with itself. */
    const courses = [];
    let left = px;
    while (left > 0) {
      let h = pick(CFG.masonryCourseMin, CFG.masonryCourseMax);
      if (left - h < CFG.masonryCourseMin) h = left;   /* swallow the remainder */
      courses.push({ h: h, y: px - left, stones: [] });
      left -= h;
    }
    for (let r = 0; r < courses.length; r++) {
      const co = courses[r];
      let x = -pick(0, px - 1);          /* a random start, so joints stagger */
      let w = px;
      while (w > 0) {
        let sw = pick(CFG.masonryStoneMin, CFG.masonryStoneMax);
        if (w - sw < CFG.masonryStoneMin) sw = w;
        co.stones.push({ x: x, w: sw, shade: (rand() - 0.5) * 2, tall: false });
        x += sw; w -= sw;
      }
    }

    /* Real rubble is not courses of equal blocks: every so often a big stone
       takes up two courses at once, and that is most of what stops this reading
       as brickwork. A tall stone SWALLOWS the ground it stands over -- the
       stones of the course below, their head joints and the bed joint between
       -- or the course below simply paints back over it and leaves stray marks
       down the middle of the big block. */
    for (const co of courses) co.covered = new Uint8Array(px);
    for (let r = 0; r + 1 < courses.length; r++) {
      for (const st of courses[r].stones) {
        if (rand() > 0.22) continue;
        st.tall = true;
        st.h = courses[r].h + courses[r + 1].h;
        const below = courses[r + 1].covered;
        for (let x = st.x; x < st.x + st.w; x++) below[((x % px) + px) % px] = 1;
      }
    }
    const buried = (co, st) => co.covered[((Math.floor(st.x + st.w / 2) % px) + px) % px];

    const c = document.createElement('canvas');
    c.width = px; c.height = px;
    const g = c.getContext('2d');
    g.clearRect(0, 0, px, px);

    /* Each stone takes its own shade, drawn three times a tile apart so a stone
       crossing the seam is the same stone on both sides of it. */
    for (const co of courses) {
      for (const st of co.stones) {
        if (buried(co, st)) continue;
        const v = st.shade * CFG.masonryVariation;
        const dark = v < 0;
        const h = (st.tall ? st.h : co.h) - 1;
        g.fillStyle = 'rgba(' + (dark ? '18,15,12' : '255,250,238')
                    + ',' + Math.abs(v).toFixed(3) + ')';
        for (let k = -1; k <= 1; k++) {
          g.fillRect(st.x + 1 + k * px, co.y + 1, st.w - 1, h);
        }
      }
    }

    /* Then the joints, straight off the same model. A bed joint is drawn in
       segments so it can be left out under a stone that spans two courses. */
    g.fillStyle = 'rgba(14,11,9,' + Math.min(1, CFG.masonryMortar).toFixed(3) + ')';
    for (let r = 0; r < courses.length; r++) {
      const co = courses[r];
      for (const st of co.stones) {
        if (buried(co, st)) continue;
        for (let k = -1; k <= 1; k++) {
          g.fillRect(st.x + k * px, co.y, 1, st.tall ? st.h : co.h);  /* head joint */
        }
      }
      /* The bed joint along the top of this course, broken wherever a stone
         from the course above reaches down through it. */
      for (let x = 0; x < px; x++) {
        if (!co.covered[x]) g.fillRect(x, co.y, 1, 1);
      }
    }

    return c;
  },

  /* A material somebody DREW, rather than one the game generates: the pictures
     dropped into textures/<name>/, inlined into the page by build.py.

     ONE canvas per picture, each squared up to exactly one square metre -- and a
     square metre wears one of them, chosen from WHERE THE SQUARE IS (see
     pickFor) rather than by laying them out in a grid. Laid out in a grid, nine
     pictures of dirt made a three-metre tile, and what you saw was the tile: the
     same three by three arrangement repeating down the floor, so the ARRANGEMENT
     was the surface and the pictures were only its squares.

     An empty array when the material has no pictures, when the pictures are
     switched off, or before they have all decoded -- so everything downstream
     falls back to the generated tile without having to know this exists. */
  matPictures(name) {
    if (this.pics[name] !== undefined) return this.pics[name];
    const use = this.pictures ? Textures.live[name] : null;
    let list = [];
    if (use && use.length) {
      const px = Math.max(8, Math.round(CFG.patternPx));
      list = use.map((img) => {
        const c = document.createElement('canvas');
        c.width = px; c.height = px;
        /* Whatever size the picture was drawn at, it fills its square metre, so
           the pictures land on the grid rather than floating over it. */
        c.getContext('2d').drawImage(img, 0, 0, px, px);
        return c;
      });
    }
    this.pics[name] = list;
    return list;
  },

  /* Which of a material's pictures one square metre wears, folded down from the
     square's own two grid coordinates and a salt that tells one surface from
     another standing on the same square (a block's left side from its right, a
     side from the ground).

     A PURE function of where the square is, so the surface is the same every
     frame and does not change when the view turns -- and because it is the
     square's own coordinates, two squares a long way apart agree by
     construction rather than by being made in the same pass.

     Multiplying the coordinates by large primes and mixing the bits is what
     makes neighbours land all over the sequence. Walking the grid and adding one
     -- `(x + y) % n`, say -- lays the pictures out in diagonals, which is the
     mosaic again with extra steps. */
  pickIndex(x, y, n, salt) {
    let v = Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663)
          ^ Math.imul(salt | 0, 83492791);
    v = Math.imul(v ^ (v >>> 16), 2246822519);
    v = Math.imul(v ^ (v >>> 13), 3266489917);
    return ((v ^ (v >>> 16)) >>> 0) % n;
  },

  /* The pick for a named material, through the list it actually has -- so a
     material with no pictures, or one, costs nothing and wears 0. */
  pickFor(name, x, y, salt) {
    const list = this.matPictures(name);
    if (list.length < 2) return 0;
    return this.pickIndex(x, y, list.length, salt);
  },

  /* A surface colour with its material baked into it, cached: one fill, not
     two. Filling every face twice -- once for the colour, once for an overlay
     on top -- cost eight milliseconds a frame, which was half the budget. The
     price of baking is that the lighting has to be stepped so the cache stays
     small; at this resolution the banding reads as paint.

     A material somebody DREW does not come through here as an overlay at all --
     the picture is the colour, and it is multiplied by `lit`, which is the
     shading with no colour of its own. See matPictures().

     `tag` tells two of these apart when the same colour and material are laid
     in different places -- a canvas pattern carries its own placement with it,
     so one shared between the floor at one height and the floor at the next
     would hand the second the first's transform, a metre out. Only the ground
     uses it, and floor heights are whole numbers, so it costs a few tiles.

     `pick` names which of the material's pictures this pattern wears. It is part
     of the key because two pictures are two surfaces: the whole point is that the
     square next door may wear the other one. */
  matPattern(colour, name, tag, lit, pick) {
    const list = this.matPictures(name);
    const which = list.length ? (pick || 0) % list.length : 0;
    const pic = list.length ? list[which] : null;
    /* A dropped-in picture IS the surface, so only the light is baked over it --
       `lit` is the shading with no colour of its own, see lightShade(). A
       generated material is a transparent overlay ON the tile's colour instead,
       so the two are different surfaces and may not share a cache entry. */
    const key = 'm|' + name + '|' + (pic ? 'pic|' + which + '|' + lit : colour)
              + (tag === undefined ? '' : '|' + tag);
    let pat = this.patCache[key];
    if (pat) return pat;
    const tile = pic ? null : this.matTile(name);
    const px = pic ? pic.width : tile.width;
    const c = document.createElement('canvas');
    c.width = px; c.height = px;
    const g = c.getContext('2d');
    if (pic) {
      g.drawImage(pic, 0, 0);
      g.globalCompositeOperation = 'multiply';
      g.fillStyle = lit || '#ffffff';
      g.fillRect(0, 0, px, px);
      g.globalCompositeOperation = 'source-over';
    } else {
      g.fillStyle = colour;
      g.fillRect(0, 0, px, px);
      g.globalAlpha = Math.max(0, Math.min(1, CFG.texStrength));
      g.drawImage(tile, 0, 0);
      g.globalAlpha = 1;
    }
    pat = this.bctx.createPattern(c, 'repeat');
    pat._pinned = '';
    pat._pick = pic ? which : -1;
    this.patCache[key] = pat;
    return pat;
  },

  /* Map a repeating pattern onto ONE FACE, in that face's own space, rather
     than pasting it flat across the screen.
     
     `a` is the face's top corner, `b` the far end of its top edge (wM metres
     along), `d` the corner straight down from `a` (hM metres). Both edges are
     straight lines under an isometric projection and the face is a
     parallelogram, so the map from texture space to the screen is exactly
     affine -- no perspective term is needed and none is missing.
     
     One metre of wall is one tile of texture, so the courses run along the
     wall, the stones sit on its surface, and the whole thing turns with the
     wall when the view swings. Pasted in screen space it sheared instead, and
     the stonework slid across the wall as the camera moved. */
  faceFill(pat, a, b, d, wM, hM) {
    if (!pat || !pat.setTransform) return pat;
    const px = Math.max(8, Math.round(CFG.patternPx));
    const su = wM * px, sv = hM * px;
    /* ONE matrix, reused. Allocating a DOMMatrix per face costs more than the
       fill it configures -- there are about a thousand faces in a frame. */
    const dm = this._faceM || (this._faceM = new DOMMatrix());
    dm.a = (b.x - a.x) / su; dm.b = (b.y - a.y) / su;
    dm.c = (d.x - a.x) / sv; dm.d = (d.y - a.y) / sv;
    dm.e = a.x; dm.f = a.y;
    pat.setTransform(dm);
    /* kept as plain numbers so a test can check where the texture landed */
    pat._lastMatrix = [dm.a, dm.b, dm.c, dm.d, dm.e, dm.f];
    pat._pinned = '';          /* per face now: never reuse a stale transform */
    /* Whatever this pattern was placed by, it is placed by THIS now. The count
       is how the ground tells a plane it laid from a plane a ramp has since
       taken away from it. See groundFill() and ownPlane. */
    this._xformSeq = (this._xformSeq || 0) + 1;
    pat._xformSeq = this._xformSeq;
    return pat;
  },

  /* The finished fill for ONE SIDE of a block, which is what a wall IS.

     `q` is the face's own four corners in the order build() makes them: the top
     corner, the far end of the top edge, the same end at the foot, and the foot
     under the first. So `q[0]` and `q[1]` are the top edge -- the direction the
     material has to run along -- and `q[3]` is straight down from `q[0]`.

     `hM` is how tall the face really stands, which the wall clip may have cut
     down. One metre of wall is one tile of material either way, so a cut wall
     shows whole courses from the foot up rather than a squashed course.

     `lit` is the light on this face with no colour of its own, and only a
     dropped-in picture has any use for it.

     `x`/`y` are the square the block stands in and `salt` tells this face from
     the other side of the same block, which are the two things a drawn material
     picks its picture from. See pickFor(). */
  wall(colour, mat, q, hM, lit, x, y, salt) {
    return this.faceFill(
      this.matPattern(colour, mat, undefined, lit, this.pickFor(mat, x, y, salt)),
      q[0], q[1], q[3], 1, hM);
  },

  /* Pin a material to the world so it does not swim as the view moves: flat
     across the screen, which is the way the GROUND used to be painted. Each
     pattern is moved at most once per frame per anchor.
     
     Kept for two reasons. It is the cheap way and the whole ground is a big
     share of the picture, so it is the thing the mapped way has to be worth
     beating; and a test can paint one frame each way, which is how the bug this
     replaced -- stonework and moss facing the camera instead of lying on the
     floor -- is kept from creeping back. Only `mappedGround` being off reaches
     it now. */
  pin(pat, ox, oy, stamp) {
    if (!pat || !pat.setTransform) return pat;
    if (pat._pinned === stamp) return pat;
    const m = new DOMMatrix([1, 0, 0, 1, Math.round(ox), Math.round(oy)]);
    pat.setTransform(m);
    pat._lastMatrix = [m.a, m.b, m.c, m.d, m.e, m.f];
    pat._pinned = stamp;
    this._xformSeq = (this._xformSeq || 0) + 1;
    pat._xformSeq = this._xformSeq;
    return pat;
  },

  /* The finished fill for the roof of a square of the world: the ground
     underfoot, the cap of a stone block, or a ramp.
     
     A material here lies ON the square -- its two axes are the square's own two
     edges -- so it turns with the view, and on a floor it runs lengthways along
     the floor rather than facing the camera. Pasted flat across the screen a
     floor had no direction at all, which is what made it read as a pattern hung
     up behind the world instead of ground you are standing on.

     `texture.strength` 0 means NO material at all, a dropped-in picture
     included: the dial is what turns the materials off, and one material that
     ignored it would be a tile nothing could switch back to plain.

     `lit` is the light with no colour of its own, and only a dropped-in picture
     has any use for it. See matPictures(). */
  ground(colour, mat, it, s, worldStamp, lit) {
    if (!mat || CFG.texStrength <= 0) return colour;
    /* WHICH of the material's pictures this square metre wears, from the
       square's own coordinates -- so the pick is the same however the ground is
       reached, and two floors at two heights wear the same scatter. */
    const pat = this.matPattern(colour, mat, it.cell.h, lit,
      this.pickFor(mat, it.cell.x, it.cell.y, PICK_GROUND));
    if (!this.mappedGround) return this.pin(pat, -s.cam.ox, -s.cam.oy, worldStamp);
    /* A ramp is the one square tilted in its own plane -- its corners sit at two
       different heights -- so it is mapped from its own corners, the same as a
       wall face is. Every flat square, floor or block cap, is in the one plane
       for its height, and they share a transform. */
    if (it.cell.slope === SLOPE_FLAT) return this.groundFill(pat, s, it);
    return this.faceFill(pat, it.top[0], it.top[1], it.top[3], 1, 1);
  },

  /* Lay a material in the plane of the ground, from the shared plane rather
     than from the square's own corners.
     
     Every flat square at the same height is the same parallelogram of the same
     plane, so one transform places the material on all of them at once -- that
     is exactly what the square's own `top` corners say (north, east, west) --
     and a square a metre higher is that same map moved up the picture by one
     rise. One metre of ground is one tile of material, so the joints run along
     the edges of the squares on every square at once, whichever way the grid is
     turned.
     
     This is what makes mapping the ground affordable at all. Mapping a material
     onto one face costs about 50 microseconds, and the ground is most of the
     picture: 350 squares of it face by face took drawing from 8.7ms to 43ms
     when that was tried. Set once per material per height per frame it costs
     about what pasting it flat used to. */
  groundFill(pat, s, it) {
    if (!pat || !pat.setTransform) return pat;
    const stamp = this._frameStamp;
    const laid = pat._laid === stamp;
    /* Laid this frame -- and, when the rule that keeps a plane its own is on,
       nothing has written a transform onto this pattern since, so it is still
       carrying THIS floor's plane. Both halves are needed: a ramp at the same
       height wears the same pattern and is mapped from its own sloped corners
