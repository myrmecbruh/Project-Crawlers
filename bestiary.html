html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink);
  font-family: 'Scriptorium', 'Courier New', monospace; font-size: 16px; font-synthesis: none; -webkit-font-smoothing: none; font-smooth: never; line-height: 1; }
#view { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; display: block; }
.parch, #bar, #ledger, #panel, #tip, .card, #roster .card-c, #debug, #rooms, #orders, #map, #bestiary {
  background: var(--parch);
  background-image: radial-gradient(rgba(90,60,20,.18) 1px, transparent 1.5px), radial-gradient(rgba(255,240,200,.25) 1px, transparent 1.5px);
  background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 4px;
  border: var(--px) solid var(--edge);
  box-shadow: 0 0 0 var(--px) var(--parch-dark), 0 0 0 calc(var(--px) * 2) var(--edge), 4px 4px 0 calc(var(--px) * 2) rgba(0,0,0,.55);
}
#bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px 6px; z-index: 5; }
#bar .title { font-weight: 700; margin-right: 8px; letter-spacing: 1px; }
#bar .title small { font-weight: 400; color: var(--ink-soft); }
#bar .story { font-weight: 700; padding: 0 6px; min-width: 64px; text-align: center; }
#bar .fps { margin-left: auto; font-weight: 700; color: var(--red); padding: 0 4px; }
button { font: inherit; color: var(--ink); background: var(--parch-dark); border: var(--px) solid var(--edge); padding: 2px 8px; cursor: pointer;
  box-shadow: inset -2px -2px 0 rgba(0,0,0,.25), inset 2px 2px 0 rgba(255,255,255,.3); }
button:hover { background: #cdb57f; }
button:active, button.on { background: var(--ink-soft); color: var(--parch); box-shadow: inset 2px 2px 0 rgba(0,0,0,.35); }
#ledger { position: fixed; right: 8px; bottom: 8px; width: min(560px, calc(100vw - 32px)); padding: 6px 8px; font-size: 16px; z-index: 4; display: flex; flex-direction: column; }
#ledger .ltabs { display: flex; gap: 4px; margin-bottom: 4px; }
#ledger .ltabs button.on { background: var(--edge); color: var(--parch); }
#ledger .lbody { max-height: 30vh; overflow-y: auto; }
#ledger .lhint { font-size: 16px; color: var(--ink-soft); margin-top: 3px; }
#ledger .entry.more { cursor: pointer; }
#ledger .plus { display: inline-block; width: 22px; color: var(--ink-soft); }
#ledger .mech { font-size: 16px; color: var(--ink-soft); padding: 2px 0 3px 14px; }
#ledger .mech .throw { color: var(--ink); }
#ledger .entry { padding: 1px 0; border-bottom: 1px dotted rgba(58,38,22,.25); }
#ledger .event { color: var(--red); font-weight: 700; }
#ledger .pip { color: var(--green); font-weight: 700; }
#ledger .refuse { color: var(--red); }
#ledger b { color: var(--green); }
#ledger .ok { color: var(--green); } #ledger .no { color: var(--red); }
#roster { position: fixed; left: 8px; top: 60px; display: flex; flex-direction: column; gap: 6px; z-index: 4; }
#roster .card-c { cursor: pointer; padding: 3px; text-align: center; width: 72px; }
#roster .card-c canvas { width: 68px; height: 80px; image-rendering: pixelated; display: block; border: var(--px) solid var(--edge); background: #1c140c; }
#roster .card-c .nm { font-size: 16px; margin-top: 2px; }
#roster .card-c.on { background-color: var(--gold); }
#debug { position: fixed; left: 90px; top: 60px; width: 270px; max-height: calc(100vh - 80px); overflow-y: auto; padding: 8px 10px; z-index: 7; display: none; font-size: 16px; }
#debug .ph { display: flex; justify-content: space-between; font-size: 16px; }
#debug .x { cursor: pointer; padding: 0 4px; border: var(--px) solid var(--edge); background: var(--parch-dark); }
#debug #fps { font-weight: 700; color: var(--red); margin: 4px 0; }
#debug .dh { font-weight: 700; margin-top: 8px; border-top: var(--px) solid var(--parch-dark); padding-top: 3px; }
#debug .drow { display: grid; grid-template-columns: 70px 1fr 40px; gap: 4px; align-items: center; }
#debug input[type=range] { width: 100%; accent-color: var(--red); }
#debug button { margin-top: 8px; width: 100%; }
#roster .card-c .bars { display: flex; gap: 1px; height: 10px; align-items: flex-end; margin: 2px 2px 0; }
#roster .card-c .bars i { flex: 1; display: block; min-height: 1px; }
#roster .card-c.gone canvas { filter: grayscale(1) brightness(0.5); }
#roster .card-c.gone .nm { text-decoration: line-through; }
#roster .card-c.hurt { background-color: #d8a080; }
#panel .needs { margin-bottom: 6px; }
#panel .need { display: grid; grid-template-columns: 82px 1fr 14px; gap: 4px; align-items: center; font-size: 16px; }
#panel .need .bar { height: 6px; border: 1px solid var(--edge); background: rgba(0,0,0,.15); }
#panel .need .bar i { display: block; height: 100%; }
#ledger .warn { color: #8a5a10; }
#panel .need { grid-template-columns: 78px 22px 1fr 22px !important; }
#panel .arrs { display: flex; gap: 1px; align-items: center; justify-content: flex-start; }
#panel .arrs.l { justify-content: flex-end; }
#panel .tri { display: inline-block; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
#panel .tri.dn { border-right: 5px solid #b0221a; }
#panel .tri.up { border-left: 5px solid #2f7a1e; }
#orders { position: fixed; left: 90px; top: 60px; width: 360px; max-height: calc(100vh - 90px); overflow-y: auto; padding: 8px 10px; z-index: 6; display: none; font-size: 16px; }
#orders .ph { display: flex; justify-content: space-between; font-size: 16px; }
#orders .x { cursor: pointer; padding: 0 4px; border: var(--px) solid var(--edge); background: var(--parch-dark); }
#orders .pl { font-size: 16px; color: var(--ink-soft); margin: 4px 0; }
#orders .order { display: flex; align-items: center; gap: 3px; padding: 2px 0; border-top: 1px dotted rgba(58,38,22,.3); }
#orders .order button { padding: 0 4px; font-size: 16px; }
#orders .order.off label { color: var(--ink-soft); text-decoration: line-through; }
#rooms { position: fixed; left: 90px; top: 60px; width: min(320px, calc(100vw - 110px)); max-height: calc(100vh - 90px); overflow-y: auto; padding: 8px 10px; z-index: 6; display: none; font-size: 16px; }
#rooms .ph { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 4px; }
#rooms .x { cursor: pointer; padding: 0 4px; border: var(--px) solid var(--edge); background: var(--parch-dark); }
#rooms .room { padding: 4px 2px; border-top: 1px dotted rgba(58,38,22,.35); cursor: pointer; }
#rooms .room:hover { background: rgba(255,226,138,.35); }
#rooms .room.camp b { color: var(--red); }
#rooms .room .tags { color: var(--ink-soft); font-style: italic; }
#panel .pin { cursor: pointer; font-size: 16px; padding: 0 3px; border: 1px solid var(--edge); margin-left: 3px; }
#panel .pin.on { background: var(--red); color: var(--parch); }
#tip { position: fixed; pointer-events: none; padding: 4px 8px; max-width: 420px; font-size: 16px; z-index: 6; display: none; }
#panel { position: fixed; right: 8px; top: 60px; width: min(300px, calc(100vw - 32px)); max-height: calc(72vh - 90px); overflow-y: auto; padding: 8px 10px; z-index: 5; display: none; }
#panel .ph { display: flex; justify-content: space-between; font-size: 16px; }
#panel .x { cursor: pointer; padding: 0 4px; border: var(--px) solid var(--edge); background: var(--parch-dark); line-height: 1.1; }
#panel .pl { font-size: 16px; color: var(--ink-soft); margin: 4px 0 8px; }
#panel .attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; margin-bottom: 6px; }
#panel .attr { display: flex; justify-content: space-between; align-items: center; }
#panel .pips i { display: inline-block; width: 6px; height: 6px; margin-left: 2px; border: 1px solid var(--edge); background: transparent; }
#panel .pips i.on { background: var(--red); }

#panel .row { display: flex; justify-content: space-between; font-size: 16px; gap: 8px; }
#panel .lore { font-size: 15px; font-style: italic; opacity: .85; margin-top: 6px; line-height: 1.25; }

.card h1 { margin: 0; font-size: 16px; letter-spacing: 2px; color: var(--red); }
.card .ver { color: var(--ink-soft); margin-bottom: 8px; }
.card ul { padding-left: 18px; font-size: 16px; }

body.viewer { overflow: hidden; background: #140e09; }
#vbar { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 8px; }
#vbar .vtitle { font-family: 'Pixtura12', monospace; font-size: 24px; margin-right: 6px; }
#vbar .vtitle small { color: var(--ink-soft); font-size: 16px; }
#vbar input, #vbar select { font: inherit; color: var(--ink); background: #e8d8b0; border: var(--px) solid var(--edge); padding: 2px 6px; }
#vbar input { flex: 1 1 180px; min-width: 120px; }
#count { margin-left: auto; color: var(--ink-soft); }
#filters { position: fixed; top: 66px; left: 8px; bottom: 8px; width: 230px; overflow-y: auto; padding: 6px 8px; z-index: 4; }
#filters .fg { margin-bottom: 8px; }
#filters .fh { font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 3px; }
#filters .fh span { color: var(--ink-soft); cursor: pointer; font-weight: 400; }
#filters .chips { display: flex; flex-wrap: wrap; gap: 3px; }
#filters .chips button { padding: 1px 5px; font-size: 16px; }
#grid { position: fixed; top: 66px; left: 254px; right: 8px; bottom: 8px; overflow-y: auto; padding: 0 4px 16px; }
body.nofilters #filters { display: none; } body.nofilters #grid { left: 8px; }
#grid h2 { font-family: 'Pixtura12', monospace; font-size: 24px; color: var(--parch); margin: 12px 4px 6px; font-weight: 400; }
#grid h2 small { font-family: 'Scriptorium', monospace; font-size: 16px; color: var(--parch-dark); }
#grid .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.kcard { cursor: pointer; padding: 4px; text-align: center; background: var(--parch); border: var(--px) solid var(--edge); box-shadow: 3px 3px 0 rgba(0,0,0,.5); }
.kcard:hover { background: #e4d2a4; }
.kcard canvas { width: 120px; height: 120px; image-rendering: pixelated; display: block; margin: 0 auto 3px; background: #1c140c; border: var(--px) solid var(--edge); }
.kcard .kn { font-weight: 700; }
.kcard .kt { color: var(--ink-soft); font-size: 16px; }
#detail { position: fixed; inset: 0; z-index: 10; background: #0e0a07; display: none; }
#detail.open { display: flex; }
#stage { position: relative; flex: 1; min-width: 0; }
#big { width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: grab; }
#controls { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 6px; justify-content: center; max-width: calc(100% - 24px); }
#hint { position: absolute; top: 10px; left: 0; right: 0; text-align: center; color: var(--parch-dark); font-size: 16px; pointer-events: none; }
#info { width: 330px; overflow-y: auto; padding: 8px 10px; margin: 8px; }
#info h1 { font-family: 'Pixtura12', monospace; font-size: 24px; font-weight: 400; margin: 0 0 4px; }
#info .sub { color: var(--ink-soft); margin-bottom: 8px; }
#info .row { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; border-bottom: 1px dotted rgba(58,38,22,.25); }
#info .row span:first-child { color: var(--ink-soft); }
#info .lore { font-style: italic; margin-top: 10px; line-height: 1.25; }
#info .attrs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px 10px; margin: 8px 0; }
@media (max-width: 700px) {
  #filters { top: auto; height: 40vh; width: auto; right: 8px; display: none; z-index: 6; }
  body.showfilters #filters { display: block; }
  #grid { left: 8px; }
  #grid .cards { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .kcard canvas { width: 96px; height: 96px; }
  #detail.open { flex-direction: column; }
  #info { width: auto; max-height: 38vh; }
}
</style>
</head>

Hyd\u014dr", "archetype": "Skirmisher", "name": "Reedart", "form": "reed", "size": "medium", "sociality": "solitary", "disposition": "hostile", "move": "swim", "diet": "meat", "light": "shy of it", "sense": "tremor", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 5, "end": 2, "pre": 3, "int": 4, "wil": 1, "lore": "Reedart shed their spines every forty days; a pool edged with floating spines means the reeds have moved on, and the pool is safe to drink from."}, {"lineage": "Flora", "affinity": "Hyd\u014dr", "archetype": "Bulwark", "name": "Nymphang", "form": "lily", "size": "small", "sociality": "solitary", "disposition": "hostile", "move": "swim", "diet": "meat", "light": "shy of it", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 4, "end": 5, "pre": 3, "int": 2, "wil": 1, "lore": "Nymphang flowers close on anything that lands, and a closed flower stays shut for three days, so a pond of shut lilies has already fed well."}, {"lineage": "Flora", "affinity": "Hyd\u014dr", "archetype": "Herald", "name": "Snapweed", "form": "seaweed", "size": "small", "sociality": "pack", "disposition": "hostile", "move": "swim", "diet": "meat", "light": "indifferent", "sense": "sight", "temper": "curious", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 1, "end": 2, "pre": 5, "int": 3, "wil": 4, "lore": "Snapweed strands drift toward the last thing that moved in the water. Throw a stone and they follow it for a minute or so."}, {"lineage": "Flora", "affinity": "Hyd\u014dr", "archetype": "Arcanist", "name": "Chalice", "form": "pitcher-plant", "size": "medium", "sociality": "solitary", "disposition": "benign", "move": "root", "diet": "meat", "light": "shy of it", "sense": "smell", "temper": "ambusher", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 4, "agi": 4, "end": 1, "pre": 4, "int": 5, "wil": 4, "lore": "Rain collected in a Chalice for a season turns faintly luminous; the plant is drowning the insects that glow, not glowing itself."}, {"lineage": "Flora", "affinity": "Hyd\u014dr", "archetype": "Warden", "name": "Pondling", "form": "lily", "size": "small", "sociality": "pack", "disposition": "benign", "move": "swim", "diet": "meat", "light": "shy of it", "sense": "tremor", "temper": "territorial", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 3, "end": 1, "pre": 1, "int": 1, "wil": 4, "lore": "Pondling pads link root to root under the surface; cut one and the whole raft of them draws in, closing the water over."}, {"lineage": "Flora", "affinity": "Pyr", "archetype": "Brute", "name": "Scorchid", "form": "orchid", "size": "medium", "sociality": "pair", "disposition": "hostile", "move": "root", "diet": "light", "light": "shy of it", "sense": "heat", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 4, "agi": 1, "end": 3, "pre": 2, "int": 1, "wil": 2, "lore": "Scorchid petals are cool to the touch in the dark and hot enough to blister by lamplight; a pair always opens toward the same flame."}, {"lineage": "Flora", "affinity": "Pyr", "archetype": "Skirmisher", "name": "Flarrow", "form": "bramble", "size": "medium", "sociality": "solitary", "disposition": "hostile", "move": "root", "diet": "heat", "light": "drawn to it", "sense": "sight", "temper": "roamer", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 6, "end": 1, "pre": 4, "int": 4, "wil": 3, "lore": "Flarrow thorns hold heat for hours after the bramble has fed. Old crawlers wrap them in cloth as hand-warmers."}, {"lineage": "Flora", "affinity": "Pyr", "archetype": "Bulwark", "name": "Cactinder", "form": "cactus", "size": "small", "sociality": "pair", "disposition": "benign", "move": "root", "diet": "light", "light": "indifferent", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 1, "end": 4, "pre": 2, "int": 4, "wil": 4, "lore": "Cactinder pulp burns clean and without smoke, but only after it has been dried for a week in the dark; fresh, it just sizzles."}, {"lineage": "Flora", "affinity": "Pyr", "archetype": "Herald", "name": "Tinderbell", "form": "flower", "size": "tiny", "sociality": "pack", "disposition": "benign", "move": "root", "diet": "light", "light": "shy of it", "sense": "heat", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 4, "end": 1, "pre": 4, "int": 4, "wil": 1, "lore": "A bed of Tinderbells rings faintly as warmth passes over it, loud enough to hear a torch coming around a corner."}, {"lineage": "Flora", "affinity": "Pyr", "archetype": "Arcanist", "name": "Magmallow", "form": "mallow", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "root", "diet": "heat", "light": "shy of it", "sense": "hearing", "temper": "roamer", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 2, "end": 2, "pre": 1, "int": 5, "wil": 3, "lore": "Magmallow root, boiled, makes a paste that dulls a burn; the plant grows only where the rock is warm enough to cook an egg."}, {"lineage": "Flora", "affinity": "Pyr", "archetype": "Warden", "name": "Singe", "form": "thorn", "size": "small", "sociality": "pair", "disposition": "hostile", "move": "root", "diet": "light", "light": "shy of it", "sense": "heat", "temper": "territorial", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 2, "end": 1, "pre": 2, "int": 1, "wil": 4, "lore": "Singe thorns come in pairs on facing stems, and a creature caught between them is held rather than pierced, until it stops struggling."}, {"lineage": "Flora", "affinity": "Gaea", "archetype": "Brute", "name": "Gnarl", "form": "root", "size": "small", "sociality": "pair", "disposition": "hostile", "move": "burrow", "diet": "stone", "light": "drawn to it", "sense": "tremor", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 2, "end": 1, "pre": 2, "int": 4, "wil": 1, "lore": "Gnarl roots split rock by swelling at night; a crack that widens by a finger overnight has one in it."}, {"lineage": "Flora", "affinity": "Gaea", "archetype": "Skirmisher", "name": "Burramble", "form": "bramble", "size": "medium", "sociality": "pack", "disposition": "hostile", "move": "burrow", "diet": "stone", "light": "indifferent", "sense": "sight", "temper": "ambusher", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 5, "end": 3, "pre": 4, "int": 4, "wil": 2, "lore": "Burramble seeds are carried inside stone chips it breaks off and spits; a thicket's outer edge moves about a metre a year."}, {"lineage": "Flora", "affinity": "Gaea", "archetype": "Bulwark", "name": "Mossle", "form": "moss", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "burrow", "diet": "stone", "light": "drawn to it", "sense": "tremor", "temper": "roamer", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 1, "end": 3, "pre": 4, "int": 2, "wil": 3, "lore": "Mossle is the only thing that grows on Coilossus shells, and it sheds a Coilossus's resting place like a green footprint."}, {"lineage": "Flora", "affinity": "Gaea", "archetype": "Herald", "name": "Scree", "form": "flower", "size": "tiny", "sociality": "solitary", "disposition": "benign", "move": "burrow", "diet": "stone", "light": "drawn to it", "sense": "tremor", "temper": "territorial", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 3, "end": 2, "pre": 4, "int": 4, "wil": 3, "lore": "A Scree flower opens once, for a single day, on the top of a pile of broken rock, and nobody has seen one twice in the same place."}, {"lineage": "Flora", "affinity": "Gaea", "archetype": "Arcanist", "name": "Grittle", "form": "nettle", "size": "tiny", "sociality": "swarm", "disposition": "benign", "move": "burrow", "diet": "stone", "light": "shy of it", "sense": "tremor", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": "size", "mgt": 1, "agi": 3, "end": 2, "pre": 1, "int": 6, "wil": 1, "lore": "Grittle swarms settle in cracks and set like mortar; a wall held together by them flakes apart in a single wet season."}, {"lineage": "Flora", "affinity": "Gaea", "archetype": "Warden", "name": "Mandrock", "form": "mandrake", "size": "small", "sociality": "pair", "disposition": "beneficial", "move": "burrow", "diet": "stone", "light": "indifferent", "sense": "hearing", "temper": "curious", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 4, "end": 2, "pre": 4, "int": 2, "wil": 5, "lore": "Pulled up, a Mandrock screams, then wanders off on its roots looking for its pair. Following it finds the other one."}, {"lineage": "Flora", "affinity": "Aeth\u0113r", "archetype": "Brute", "name": "Starburr", "form": "thistle", "size": "small", "sociality": "pair", "disposition": "beneficial", "move": "fly", "diet": "light", "light": "drawn to it", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 2, "end": 1, "pre": 4, "int": 2, "wil": 3, "lore": "Starburr heads face the brightest light in a room, even through closed eyelids of stone; lost crawlers have followed them out."}, {"lineage": "Flora", "affinity": "Aeth\u0113r", "archetype": "Skirmisher", "name": "Dandelume", "form": "dandelion", "size": "medium", "sociality": "solitary", "disposition": "benign", "move": "fly", "diet": "light", "light": "indifferent", "sense": "sight", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 2, "agi": 4, "end": 4, "pre": 1, "int": 2, "wil": 3, "lore": "Dandelume seeds glow for three nights after they leave the head, then fall dark wherever they land and root there."}, {"lineage": "Flora", "affinity": "Aeth\u0113r", "archetype": "Bulwark", "name": "Aegilily", "form": "lily", "size": "medium", "sociality": "pair", "disposition": "beneficial", "move": "fly", "diet": "light", "light": "drawn to it", "sense": "smell", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 4, "end": 6, "pre": 1, "int": 1, "wil": 1, "lore": "An Aegilily pair lays its pads over sleeping creatures; animals that nest under them are never taken by flyers."}, {"lineage": "Flora", "affinity": "Aeth\u0113r", "archetype": "Herald", "name": "Glowbell", "form": "flower", "size": "small", "sociality": "pack", "disposition": "benign", "move": "fly", "diet": "light", "light": "drawn to it", "sense": "smell", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 3, "end": 3, "pre": 6, "int": 3, "wil": 3, "lore": "Glowbells drift toward cooking smells and hang above a meal like a chandelier until the pot is cold."}, {"lineage": "Flora", "affinity": "Aeth\u0113r", "archetype": "Arcanist", "name": "Prismoss", "form": "moss", "size": "small", "sociality": "pair", "disposition": "hostile", "move": "root", "diet": "light", "light": "drawn to it", "sense": "hearing", "temper": "skittish", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 2, "agi": 3, "end": 2, "pre": 3, "int": 4, "wil": 3, "lore": "Prismoss splits lamplight into colours and throws them across the walls; its patches are always found in pairs, facing across a room."}, {"lineage": "Flora", "affinity": "Aeth\u0113r", "archetype": "Warden", "name": "Solvia", "form": "sage", "size": "small", "sociality": "pair", "disposition": "benign", "move": "fly", "diet": "light", "light": "shy of it", "sense": "hearing", "temper": "skittish", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 1, "end": 1, "pre": 4, "int": 4, "wil": 4, "lore": "Solvia leaves chewed at night let the eye see a little further into the dark; chewed by day, they do nothing but taste of soap."}, {"lineage": "Flora", "affinity": "Erebos", "archetype": "Brute", "name": "Mortulip", "form": "tulip", "size": "medium", "sociality": "solitary", "disposition": "beneficial", "move": "root", "diet": "carrion", "light": "shy of it", "sense": "smell", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 5, "agi": 1, "end": 1, "pre": 3, "int": 1, "wil": 3, "lore": "Mortulip grows only from a body, and the colour of the bloom tells what fed it: white for bone-eaters, red for anything warm-blooded."}, {"lineage": "Flora", "affinity": "Erebos", "archetype": "Skirmisher", "name": "Gravine", "form": "vine", "size": "small", "sociality": "pack", "disposition": "hostile", "move": "root", "diet": "carrion", "light": "shy of it", "sense": "smell", "temper": "roamer", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 2, "agi": 6, "end": 3, "pre": 4, "int": 4, "wil": 2, "lore": "Gravine creeps toward the smell of a wound from up to thirty metres away and never grows toward the healthy."}, {"lineage": "Flora", "affinity": "Erebos", "archetype": "Bulwark", "name": "Tombark", "form": "tree", "size": "medium", "sociality": "pack", "disposition": "benign", "move": "root", "diet": "carrion", "light": "shy of it", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 3, "end": 6, "pre": 2, "int": 2, "wil": 1, "lore": "A Tombark grove is always planted on an old burial; the trees drink what lies under them and drop acorns full of grave-dust."}, {"lineage": "Flora", "affinity": "Erebos", "archetype": "Herald", "name": "Murkwort", "form": "bramble", "size": "small", "sociality": "pack", "disposition": "benign", "move": "root", "diet": "carrion", "light": "shy of it", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 4, "end": 3, "pre": 4, "int": 3, "wil": 3, "lore": "Murkwort holds water in its hollow stems through the driest season and releases it the moment something dies nearby."}, {"lineage"  1, "pre": 1, "int": 4, "wil": 4, "lore": "Inkanter ink hangs in still water for hours, and crawlers have copied the shapes it leaves down as if they were writing."}, {"lineage": "Mollusca", "affinity": "Hyd\u014dr", "archetype": "Warden", "name": "Blorp", "form": "octopus", "size": "small", "sociality": "pair", "disposition": "beneficial", "move": "swim", "diet": "meat", "light": "indifferent", "sense": "heat", "temper": "skittish", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 4, "end": 1, "pre": 1, "int": 1, "wil": 5, "lore": "Other creatures lay their eggs near a Blorp pair, because a Blorp guards any nest in reach as fiercely as its own."}, {"lineage": "Mollusca", "affinity": "Pyr", "archetype": "Brute", "name": "Snarch", "form": "snail", "size": "small", "sociality": "solitary", "disposition": "hostile", "move": "creep", "diet": "fungus", "light": "drawn to it", "sense": "tremor", "temper": "territorial", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 4, "end": 3, "pre": 4, "int": 3, "wil": 2, "lore": "A Snarch sets the fungus it eats smouldering first, and a colony leaves a trail of blackened stalks behind it."}, {"lineage": "Mollusca", "affinity": "Pyr", "archetype": "Skirmisher", "name": "Sizzler", "form": "slug", "size": "small", "sociality": "pair", "disposition": "benign", "move": "creep", "diet": "heat", "light": "shy of it", "sense": "heat", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 6, "end": 3, "pre": 1, "int": 3, "wil": 3, "lore": "Sizzlers hiss when they touch each other, so a pair moving together is heard before it is seen."}, {"lineage": "Mollusca", "affinity": "Pyr", "archetype": "Bulwark", "name": "Caldera", "form": "conch", "size": "large", "sociality": "pack", "disposition": "hostile", "move": "creep", "diet": "fungus", "light": "drawn to it", "sense": "heat", "temper": "ambusher", "tame": "wild", "lair": "wanders", "aberrant": null, " agi": 4, "end": 3, "pre": 1, "int": 2, "wil": 2, "lore": "Piddrock pairs bore their holes exactly the width of their shell, and the holes last long after they have gone."}, {"lineage": "Mollusca", "affinity": "Gaea", "archetype": "Skirmisher", "name": "Slickstone", "form": "slug", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "burrow", "diet": "stone", "light": "indifferent", "sense": "tremor", "temper": "ambusher", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 5, "end": 1, "pre": 1, "int": 4, "wil": 3, "lore": "A Slickstone polishes the rock it slides across, so its tracks are glossy lanes that catch the lamplight."}, {"lineage": "Mollusca", "affinity": "Gaea", "archetype": "Bulwark", "name": "Coilossus", "form": "ammonite", "size": "huge", "sociality": "pair", "disposition": "benign", "move": "burrow", "diet": "stone", "light": "drawn to it", "sense": "tremor", "temper": "skittish", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 6, "agi": 2, "end": 6, "pre": 4, "int": 2, "wil": 4, "lore": "A Coilossus pair can sleep a year in one hollow, and when they leave the hollow is a perfect spiral cut into the rock."}, {"lineage": "Mollusca", "affinity": "Gaea", "archetype": "Herald", "name": "Nib", "form": "limpet", "size": "tiny", "sociality": "pack", "disposition": "benign", "move": "creep", "diet": "stone", "light": "shy of it", "sense": "sight", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 2, "end": 1, "pre": 5, "int": 3, "wil": 2, "lore": "Nibs grip stone so hard that prying one loose takes a chip of the rock with it."}, {"lineage": "Mollusca", "affinity": "Gaea", "archetype": "Arcanist", "name": "Sligil", "form": "slug", "size": "small", "sociality": "pack", "disposition": "benign", "move": "creep", "diet": "stone", "light": "drawn to it", "sense": "tremor", "temper": "ambusher", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 2, "agi": 4, "end": 1, "pre": 3, "int": 4, "wil": 2, "lore": "A Sligil's trail dries into shapes like letters, and the same shapes turn up in caves no Sligil could have crossed between."}, {"lineage": "Mollusca", "affinity": "Gaea", "archetype": "Warden", "name": "Clamp", "form": "clam", "size": "small", "sociality": "pack", "disposition": "benign", "move": "burrow", "diet": "stone", "light": "drawn to it", "sense": "sight", "temper": "ambusher", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 1, "end": 1, "pre": 2, "int": 2, "wil": 4, "lore": "Clamps bury themselves just below the floor and close on anything that stands on them."}, {"lineage": "Mollusca", "affinity": "Aeth\u0113r", "archetype": "Brute", "name": "Squinkle", "form": "squid", "size": "small", "sociality": "solitary", "disposition": "hostile", "move": "fly", "diet": "light", "light": "shy of it", "sense": "sight", "temper": "roamer", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 4, "agi": 4, "end": 2, "pre": 2, "int": 1, "wil": 4, "lore": "A Squinkle flashes a single point of light to draw moths toward its arms, and swarms of them follow it through the dark."}, {"lineage": "Mollusca", "affinity": "Aeth\u0113r", "archetype": "Skirmisher", "name": "Stardust", "form": "slug", "size": "small", "sociality": "solitary", "disposition": "beneficial", "move": "fly", "diet": "fungus", "light": "drawn to it", "sense": "hearing", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 2, "agi": 6, "end": 1, "pre": 2, "int": 1, "wil": 3, "lore": "A colony of Stardust slugs on a ceiling looks like a night sky, and crawlers long underground have wept to see it."}, {"lineage": "Mollusca", "affinity": "Aeth\u0113r", "archetype": "Bulwark", "name": "Halonaut", "form": "nautilus", "size": "small", "sociality": "pair", "disposition": "hostile", "move": "fly", "diet": "fungus", "light": "drawn to it", "sense": "heat", "temper": "ambusher", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 2, "end": 3, "pre": 3, "int": 4, "wil": 1, "lore": "A Halonaut pair holds a ring of light around its shell, and insects fly into the ring and do not fly out."}, {"lineage": "Mollusca", "affinity": "Aeth\u0113r", "archetype": "Herald", "name": "Sheen", "form": "slug", "size": "tiny", "sociality": "pack", "disposition": "hostile", "move": "creep", "diet": "fungus", "light": "shy of it", "sense": "sight", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 4, "end": 1, "pre": 4, "int": 4, "wil": 4, "lore": "A Sheen coats rock with a thin film that looks like water; thirsty creatures lick it, and the Sheen eats what they leave."}, {"lineage": "Mollusca", "affinity": "Aeth\u0113r", "archetype": "Arcanist", "name": "Soothsayer", "form": "clam", "size": "small", "sociality": "pack", "disposition": "beneficial", "move": "creep", "diet": "fungus", "light": "indifferent", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 4, "end": 1, "pre": 3, "int": 6, "wil": 4, "lore": "Soothsayers snap shut in unison a minute before the ground shakes; a bed of them clattering is a warning worth running from."}, {"lineage": "Mollusca", "affinity": "Aeth\u0113r", "archetype": "Warden", "name": "Dawnwhelk", "form": "whelk", "size": "small", "sociality": "pair", "disposition": "benign", "move": "fly", "diet": "plants", "light": "shy of it", "sense": "sight", "temper": "ambusher", "tame": "tameable", "lair": "keeps a lair", "aberrant": "diet", "mgt": 3, "agi": 4, "end": 1, "pre": 1, "int": 3, "wil": 4, "lore": "A Dawnwhelk opens only when a light first comes on near it, so a camp that lights its lamps at the same time every day trains its whelks to that hour."}, {"lineage": "Mollusca", "affinity": "Erebos", "archetype": "Brute", "name": "Graveslug", "form": "slug", "size": "small", "sociality": "pack", "disposition": "hostile", "move": "creep", "diet": "carrion", "light": "shy of it", "sense": "hearing", "temper": "ambusher", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 5, "agi": 2, "end": 2, "pre": 4, "int": 3, "wil": 3, "lore": "Graveslugs burrow under fresh bodies and feed from below, so a corpse can look whole for a week while it is hollowed out."}, {"lineage": "Mollusca", "affinity": "Erebos", "archetype": "Skirmisher", "name": "Murkle", "form": "whelk", "size": "small", "sociality": "pack", "disposition": "hostile", "move": "creep", "diet": "carrion", "light": "shy of it", "sense": "hearing", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 2, "agi": 4, "end": 2, "pre": 4, "int": 3, "wil": 3, "lore": "Murkles churn up black silt as they pass, and the cloud they leave behind hangs in still water for a day."}, {"lineage": "Mollusca", "affinity": "Erebos", "archetype": "Bulwark", "name": "Casket", "form": "conch", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "creep", "diet": "carrion", "light": "shy of it", "sense": "smell", "temper": "territorial", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 4, "end": 4, "pre": 2, "int": 1, "wil": 2, "lore": "A Casket seals itself inside with a lid of stone and can wait a week without air; tapping it gets a knock back."}, {"lineage": "Mollusca", "affinity": "Erebos", "archetype": "Herald", "name": "Dirgewhelk", "form": "whelk", "size": "tiny", "sociality": "solitary", "disposition": "benign", "move": "creep", "diet": "carrion", "light": "drawn to it", "sense": "sight", "temper": "ambusher", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 3, "end": 1, "pre": 6, "int": 2, "wil": 2, "lore": "A Dirgewhelk hums through its shell when a body lies near, and the tune is the same slow three notes every time."}, {"lineage": "Mollusca", "affinity": "Erebos", "archetype": "Arcanist", "name": "Necropus", "form": "octopus", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "creep", "diet": "carrion", "light": "shy of it", "sense": "smell", "temper": "ambusher", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 3, "end": 3, "pre": 2, "int": 5, "wil": 2, "lore": "A Necropus lives in skulls and reaches out through the eye holes; a skull that moves on its own has one inside."}, {"lineage": "Mollusca", "affinity": "Erebos", "archetype": "Warden", "name": "Leechling", "form": "slug", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "creep", "diet": "blood", "light": "indifferent", "sense": "sight", "temper": "curious", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 2, "end": 1, "pre": 4, "int": 4, "wil": 5, "lore": "A Leechling drinks from sleeping creatures so gently they never wake, and leaves a small cold patch on the skin."}, {"lineage": "Pisces", "affinity": "A\u0113r", "archetype": "Brute", "name": "Gustpike", "form": "pike", "size": "medium", "sociality": "solitary", "disposition": "benign", "move": "fly", "diet": "meat", "light": "drawn to it", "sense": "sight", "temper": "territorial", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 5, "agi": 1, "end": 4, "pre": 3, "int": 1, "wil": 4, "lore": "Gustpike swim through air the way pike swim through water, holding still in a draught and darting out at whatever the wind brings."}, {"lineage": "Pisces", "affinity": "A\u0113r", "archetype": "Skirmisher", "name": "Skygar", "form": "gar", "size": "medium", "sociality": "pair", "disposition": "hostile", "move": "fly", "diet": "meat", "light": "indifferent", "sense": "hearing", "temper": "skittish", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 2, "agi": 4, "end": 3, "pre": 3, "int": 1, "wil": 4, "lore": "Skygar pairs nest in the highest crack of a chasm and never touch the floor; their eggs are glued to the rock with spit."}, {"lineage": "Pisces", "affinity": "A\u0113r", "archetype": "Bulwark", "name": "Gustpuffer", "form": "pufferfish", "size": "small", "sociality": "pack", "disposition": "benign", "move": "fly", "diet": "meat", "light": "drawn to it", "sense": "tremor", "temper": "roamer", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 3, "end": 5, "pre": 2, "int": 3, "wil": 1, "lore": "A Gustpuffer swells with air when frightened and drifts to the ceiling, where it waits, round and stuck, until it calms down."}, {"lineage": "Pisces", "affinity": "A\u0113r", "archetype": "Herald", "name": "Minnowind", "form": "minnow", "size": "tiny", "sociality": "swarm", "disposition": "benign", "move": "fly", "diet": "meat", "light": "indifferent", "sense": "tremor", "temper": "curious", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 2, "agi": 2, "end": 1, "pre": 6, "int": 3, "wil": 1, "lore": "A Minnowind swarm turns as one in a gust, and the flash of all their sides at once is how crawlers find a draught in the dark."}, {"lineage": "Pisces", "affinity": "A\u0113r", "archetype": "Arcanist", "name": "Kite", "form": "ray", "size": "medium", "sociality": "pair", "disposition": "benign", "move": "fly", "diet": "meat", "light": "shy of it", "sense": "hearing", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 2, "agi": 4, "end": 3, "pre": 1, "int": 6, "wil": 3, "lore": "Kites ride the updraughts of warm halls without beating their wings; a Kite circling overhead means warm air rising below."}, {"lineage": "Pisces", "affinity": "A\u0113r", "archetype": "Warden", "name": "Windsock", "form": "carp", "size": "medium", "sociality": "pack", "disposition": "benign", "move": "fly", "diet": "meat", "light": "drawn to it", "sense": "hearing", "temper": "territorial", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 2, "end": 4, "pre": 1, "int": 2, "wil": 4, "lore": "A Windsock pack faces into the draught all together, which makes them the best weathervane in the la t", "light": "shy of it", "sense": "smell", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 2, "end": 1, "pre": 5, "int": 4, "wil": 4, "lore": "A Lotl can regrow a lost limb in a month, and old ones often have legs of slightly different lengths."}, {"lineage": "Amphibia", "affinity": "Hyd\u014dr", "archetype": "Arcanist", "name": "Undine", "form": "newt", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "swim", "diet": "meat", "light": "shy of it", "sense": "tremor", "temper": "skittish", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 2, "end": 1, "pre": 4, "int": 4, "wil": 1, "lore": "An Undine hides beneath the surface of pools and pulls the bank's reflections into its skin to go unseen."}, {"lineage": "Amphibia", "affinity": "Hyd\u014dr", "archetype": "Warden", "name": "Dripple", "form": "toad", "size": "small", "sociality": "pack", "disposition": "benign", "move": "walk", "diet": "meat", "light": "drawn to it", "sense": "smell", "temper": "skittish", "tame": "tameable", "lair": "wanders", "aberrant": "move", "mgt": 1, "agi": 4, "end": 1, "pre": 2, "int": 4, "wil": 6, "lore": "Dripples walk from one damp place to the next, and a line of damp footprints across dry rock is a Dripple going home."}, {"lineage": "Amphibia", "affinity": "Pyr", "archetype": "Brute", "name": "Hothead", "form": "salamander", "size": "small", "sociality": "solitary", "disposition": "hostile", "move": "swim", "diet": "meat", "light": "shy of it", "sense": "hearing", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 2, "end": 1, "pre": 1, "int": 4, "wil": 4, "lore": "A Hothead warms its own skin until it steams when it is angry; the steam gives it away seconds before it charges."}, {"lineage": "Amphibia", "affinity": "Pyr", "archetype": "Skirmisher", "name": "Crackle", "form": "frog", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "swim", "diet": "heat", "light": "shy of it", "sense": "smell", "temper": "curious", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 5, "end": 2, "pre": 2, "int": 1, "wil": 2, "lore": "A Crackle eats heat from hot springs, and its skin pops and crackles as it cools, which is how it is found on a still night."}, {"lineage": "Amphibia", "affinity": "Pyr", "archetype": "Bulwark", "name": "Blister", "form": "toad", "size": "large", "sociality": "pack", "disposition": "hostile", "move": "swim", "diet": "heat", "light": "shy of it", "sense": "smell", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 2, "agi": 3, "end": 6, "pre": 2, "int": 2, "wil": 4, "lore": "A Blister's warts are full of scalding fluid; a predator that bites one lets go and never bites a toad again."}, {"lineage": "Amphibia", "affinity": "Pyr", "archetype": "Herald", "name": "Sootling", "form": "newt", "size": "small", "sociality": "pack", "disposition": "hostile", "move": "swim", "diet": "meat", "light": "shy of it", "sense": "heat", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 2, "end": 2, "pre": 6, "int": 2, "wil": 4, "lore": "Sootlings live under the film of ash that floats on hot pools and push their snouts through it to breathe, leaving little round holes."}, {"lineage": "Amphibia", "affinity": "Pyr", "archetype": "Arcanist", "name": "Scorchtongue", "form": "toad", "size": "small", "sociality": "solitary", "disposition": "hostile", "move": "swim", "diet": "meat", "light": "drawn to it", "sense": "heat", "temper": "ambusher", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 3, "end": 1, "pre": 3, "int": 4, "wil": 1, "lore": "The Scorchtongue's tongue strikes so fast it sparks, and a toad sitting still in the dark gives itself away with tiny flashes."}, {"lineage": "Amphibia", "affinity": "Pyr", "archetype": "Warden", "name": "Inglenook", "form": "newt", "size": "small", "sociality": "pair", "disposition": "benign", "move": "swim", "diet": "meat", "light": "drawn to it", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 2, "end": 2, "pre": 3, "int": 1, "wil": 6, "lore": "Inglenooks nest in the warm stones at the back of a hearth, and a camp that builds its fire against one wall will soon have a pair."}, {"lineage": "Amphibia", "affinity": "Gaea", "archetype": "Brute", "name": "Gravelgut", "form": "toad", "size": "small", "sociality": "pack", "disposition": "hostile", "move": "burrow", "diet": "stone", "light": "indifferent", "sense": "tremor", "temper": "territorial", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 4, "agi": 4, "end": 1, "pre": 4, "int": 3, "wil": 1, "lore": "A Gravelgut swallows stones to grind its food and spits them out polished; a pack's lair is paved with smooth pebbles."}, {"lineage": "Amphibia", "affinity": "Gaea", "archetype": "Skirmisher", "name": "Nubbin", "form": "frog", "size": "tiny", "sociality": "pack", "disposition": "hostile", "move": "burrow", "diet": "meat", "light": "indifferent", "sense": "tremor", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": "size", "mgt": 1, "agi": 6, "end": 1, "pre": 3, "int": 2, "wil": 2, "lore": "Nubbins sit buried to the eyes in the floor, and a patch of ground that suddenly has twenty eyes in it is a pack about to jump."}, {"lineage": "Amphibia", "affinity": "Gaea", "archetype": "Bulwark", "name": "Blindling", "form": "caecilian", "size": "small", "sociality": "pack", "disposition": "benign", "move": "swim", "diet": "stone", "light": "shy of it", "sense": "smell", "temper": "roamer", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 1, "end": 4, "pre": 4, "int": 2, "wil": 1, "lore": "Blindlings swim through wet clay as fish swim through water, and the clay closes behind them without a mark."}, {"lineag ry, and it can go months without drinking."}, {"lineage": "Amphibia", "affinity": "Aeth\u0113r", "archetype": "Skirmisher", "name": "Twinkler", "form": "frog", "size": "small", "sociality": "pack", "disposition": "hostile", "move": "fly", "diet": "meat", "light": "shy of it", "sense": "smell", "temper": "skittish", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 2, "agi": 4, "end": 1, "pre": 4, "int": 3, "wil": 1, "lore": "Twinklers light up only when they are frightened, so a pond that sparkles as you walk past has a pack that has seen you."}, {"lineage": "Amphibia", "affinity": "Aeth\u0113r", "archetype": "Bulwark", "name": "Sunmander", "form": "salamander", "size": "small", "sociality": "solitary", "disposition": "hostile", "move": "fly", "diet": "light", "light": "indifferent", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 3, "end": 4, "pre": 1, "int": 1, "wil": 4, "lore": "A Sunmander stores the light it basks in and gives it back as warmth through the night; it is the warmest thing in a cold hall."}, {"lineage": "Amphibia", "affinity": "Aeth\u0113r", "archetype": "Herald", "name": "Glister", "form": "frog", "size": "small", "sociality": "pack", "disposition": "hostile", "move": "swim", "diet": "meat", "light": "drawn to it", "sense": "sight", "temper": "curious", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 2, "end": 3, "pre": 4, "int": 2, "wil": 4, "lore": "Glisters gather where coins and metal have fallen into water, and a pond full of them is often full of treasure too."}, {"lineage": "Amphibia", "affinity": "Aeth\u0113r", "archetype": "Arcanist", "name": "Croakle", "form": "toad", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "swim", "diet": "meat", "light": "drawn to it", "sense": "sight", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 4, "end": 1, "pre": 4, "int": 4, "wil": 4, "lore": "A Croakle will not croak where anyone is lying hurt; a pond that goes quiet around a camp has noticed someone is sick."}, {"lineage": "Amphibia", "affinity": "Aeth\u0113r", "archetype": "Warden", "name": "Luma", "form": "newt", "size": "small", "sociality": "pair", "disposition": "beneficial", "move": "fly", "diet": "light", "light": "drawn to it", "sense": "smell", "temper": "skittish", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 2, "end": 3, "pre": 3, "int": 2, "wil": 5, "lore": "Lumas nest where light falls on water, and a pair will move into a camp's washing bowl if it is left out overnight."}, {"lineage": "Amphibia", "affinity": "Erebos", "archetype": "Brute", "name": "Boggart", "form": "toad", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "swim", "diet": "carrion", "light": "shy of it", "sense": "smell", "temper": "ambusher", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 3, "end": 1, "pre": 4, "int": 2, "wil": 1, "lore": "A Boggart waits in mud up to its eyes and eats only what has already drowned, so a pool with a Boggart in it has claimed lives."}, {"lineage": "Amphibia", "affinity": "Erebos", "archetype": "Skirmisher", "name": "Bogtrotter", "form": "frog", "size": "small", "sociality": "solitary", "disposition": "benign", "move": "swim", "diet": "meat", "light": "shy of it", "sense": "hearing", "temper": "curious", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 4, "end": 1, "pre": 2, "int": 1, "wil": 2, "lore": "A Bogtrotter spreads its toes wide enough to run across the top of a bog, and where it runs, the ground will bear a crawler too."}, {"lineage": "Amphibia", "affinity": "Erebos", "archetype": "Bulwark", "name": "Gloaming", "form": "toad", "size": "small", "sociality": "solitary", "disposition": "hostile", "move": "swim", "diet": "carrion", "light": "indifferent", "sense": "tremor", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 4, "end": 3, "pre": 1, "int": 3, "wil": 3, "lore": "A Gloaming wanders from pool to pool, and it always visits them in the same order; its round takes about nine days."}, {"lineage": "Amphibia", "affinity": "Erebos", "archetype": "Herald", "name": "Shadpole", "form": "tadpole", "size": "tiny", "sociality": "swarm", "disposition": "benign", "move": "swim", "diet": "meat", "light": "shy of it", "sense": "smell", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 1, "end": 1, "pre": 5, "int": 4, "wil": 3, "lore": "A Shadpole swarm turns a pool black, and larger fish steer round it, which makes the swarm a hiding place for everything small."}, {"lineage": "Amphibia", "affinity": "Erebos", "archetype": "Arcanist", "name": "Revenant", "form": "salamander", "size": "large", "sociality": "solitary", "disposition": "hostile", "move": "swim", "diet": "carrion", "light": "drawn to it", "sense": "smell", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": "size", "mgt": 2, "agi": 2, "end": 3, "pre": 1, "int": 5, "wil": 2, "lore": "A Revenant sheds its whole skin at once, and the empty skin keeps its shape for a day, standing on the bank like a sentry."}, {"lineage": "Amphibia", "affinity": "Erebos", "archetype": "Warden", "name": "Wight", "form": "newt", "size": "small", "sociality": "solitary", "disposition": "hostile", "move": "swim", "diet": "carrion", "light": "shy of it", "sense": "hearing", "temper": "territorial", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 4, "end": 3, "pre": 4, "int": 4, "wil": 4, "lore": "A Wight's call carries far over water and sounds like someone calling a name; crawlers who follow it find only the Wight."}, {"lineage": "Reptilia", "affinity": "A\u0113r", "archetype": "Brute", "name": "Dustdevil", "form": "iguana", "size": "medium", "sociality": "pack", "disposition": "benign", "move": "walk", "diet": "meat", "light": "shy of it", "sense": "hearing", "temper": "territorial", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 6, "agi": 2, "end": 4, "pre": 1, "int": 1, "wil": 2, "lore": "A Dustdevil pack spins in place to raise a column of dust, and flies caught in it fall stunned at their feet."}, {"lineage": "Reptilia", "affinity": "A\u0113r", "archetype": "Skirmisher", "name": "Sidewinder", "form": "snake", "size": "medium", "sociality": "solitary", "disposition": "hostile", "move": "walk", "diet": "meat", "light": "shy of it", "sense": "smell", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 5, "end": 2, "pre": 3, "int": 4, "wil": 4, "lore": "A Sidewinder crosses loose sand in slanting strokes and leaves a track like a row of hooks, all pointing where it went."}, {"lineage": "Reptilia", "affinity": "A\u0113r", "archetype": "Bulwark", "name": "Skywyrm", "form": "drake", "size": "huge", "sociality": "solitary", "disposition": "beneficial", "move": "fly", "diet": "meat", "light": "shy of it", "sense": "hearing", "temper": "roamer", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 5, "agi": 1, "end": 6, "pre": 3, "int": 3, "wil": 3, "lore": "The Skywyrm lays one egg in its life and guards the lair for fifty years; an empty lair with a broken shell is a wyrm that has died."}, {"lineage": "Reptilia", "affinity": "A\u0113r", "archetype": "Herald", "name": "Flick", "form": "gecko", "size": "tiny", "sociality": "solitary", "disposition": "benign", "move": "walk", "diet": "meat", "light": "shy of it", "sense": "sight", "temper": "ambusher", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 4, "end": 1, "pre": 4, "int": 2, "wil": 4, "lore": "A Flick can drop its tail and grow a new one in a season; tails that still twitch on the floor mean one has just fled."}, {"lineage": "Reptilia", "affinity": "A\u0113r", "archetype": "Arcanist", "name": "Voltilisk", "form": "basilisk", "size": "medium", name": "Snapper", "form": "tortoise", "size": "large", "sociality": "pack", "disposition": "hostile", "move": "walk", "diet": "meat", "light": "drawn to it", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 3, "end": 6, "pre": 3, "int": 3, "wil": 3, "lore": "Snappers bury themselves on the shore with only their heads showing, so a line of stones on a bank may bite."}, {"lineage": "Reptilia", "affinity": "Hyd\u014dr", "archetype": "Herald", "name": "Saltlick", "form": "iguana", "size": "medium", "sociality": "solitary", "disposition": "benign", "move": "walk", "diet": "meat", "light": "shy of it", "sense": "hearing", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 2, "end": 1, "pre": 5, "int": 2, "wil": 4, "lore": "A Saltlick eats salt from rock and sneezes it back out, and its sneezes leave little white crusts around its trail."}, {"lineage": "Reptilia", "affinity": "Hyd\u014dr", "archetype": "Arcanist", "name": "Cryolisk", "form": "basilisk", "size": "medium", "sociality": "solitary", "disposition": "hostile", "move": "walk", "diet": "meat", "light": "drawn to it", "sense": "smell", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 4, "agi": 1, "end": 3, "pre": 2, "int": 6, "wil": 2, "lore": "A Cryolisk's breath frosts the air before it, and the frost reaches a metre ahead as it walks."}, {"lineage": "Reptilia", "affinity": "Hyd\u014dr", "archetype": "Warden", "name": "Tideviper", "form": "snake", "size": "medium", "sociality": "pair", "disposition": "hostile", "move": "swim", "diet": "meat", "light": "shy of it", "sense": "sight", "temper": "skittish", "tame": "tameable", "lair": "keeps a lair", "aberrant": null, "mgt": 3, "agi": 1, "end": 2, "pre": 3, "int": 1, "wil": 4, "lore": "A Tideviper pair shares a den where the water rises and falls, and they hunt only when it is high."}, {"lineage": "Reptilia", "affinity": "Pyr", "archetype": "Brute", "name": "Pyrosaur", "form": "lizard", "size": "medium", "sociality": "solitary", "disposition": "beneficial", "move": "walk", "diet": "meat", "light": "drawn to it", "sense": "heat", "temper": "curious", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 6, "agi": 4, "end": 4, "pre": 2, "int": 2, "wil": 2, "lore": "A Pyrosaur basks on hot rock until it is too hot to touch, then runs down its prey while the prey is still cold."}, {"lineage": "Reptilia", "affinity": "Pyr", "archetype": "Skirmisher", "name": "Ashviper", "form": "snake", "size": "medium", "sociality": "solitary", "disposition": "hostile", "move": "walk", "diet": "meat", "light": "shy of it", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 2, "agi": 4, "end": 3, "pre": 3, "int": 2, "wil": 3, "lore": "An Ashviper sheds into ash rather than out of it: its old skin is found whole and grey in cold hearths, and it is fireproof enough to line a glove."}, {"lineage": "Reptilia", "affinity": "Pyr", "archetype": "Bulwark", "name": "Kilnback", "form": "tortoise", "size": "huge", "sociality": "solitary", "disposition": "benign", "move": "walk", "diet": "heat", "light": "drawn to it", "sense": "heat", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 6, "agi": 3, "end": 6, "pre": 4, "int": 4, "wil": 2, "lore": "A Kilnback's shell is so hot that clay pots can be fired on it, and a tame one would be worth a kiln."}, {"lineage": "Reptilia", "affinity": "Pyr", "archetype": "Herald", "name": "Firetail", "form": "skink", "size": "medium", "sociality": "pack", "disposition": "benign", "move": "walk", "diet": "meat", "light": "shy of it", "sense": "hearing", "temper": "skittish", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 4, "agi": 3, "end": 3, "pre": 5, "int": 4, "wil": 2, "lore": "A Firetail's tail glows brighter when it is frightened, and a pack running away leaves a trail of light."}, {"lineage": "Reptilia", "affinity": "Pyr", "archetype": "Arcanist", "name": "Pyrolisk", "form": "basilisk", "size": "medium", "sociality": "solitary", "disposition": "hostile", "move": "walk", "diet": "heat", "light": "indifferent", "sense": "tremor", "temper": "curious", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 4, "agi": 1, "end": 2, "pre": 3, "int": 4, "wil": 1, "lore": "A Pyrolisk's stare dries whatever it rests on; its prey is found shrivelled and light, and so is the moss for a metre around its resting place."}, {"lineage": "Reptilia", "affinity": "Pyr", "archetype": "Warden", "name": "Hob", "form": "skink", "size": "medium", "sociality": "pair", "disposition": "benign", "move": "walk", "diet": "meat", "light": "indifferent", "sense": "hearing", "temper": "skittish", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 4, "end": 2, "pre": 2, "int": 1, "wil": 6, "lore": "A Hob pair sweeps the ash out of a cold hearth with its tail every night and sleeps in the clean warm stones; a tidy old hearth has Hobs."}, {"lineage": "Reptilia", "affinity": "Gaea", "archetype": "Brute", "name": "Rockboa", "form": "snake", "size": "medium", "sociality": "pack", "disposition": "hostile", "move": "burrow", "diet": "meat", "light": "shy of it", "sense": "sight", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 5, "agi": 2, "end": 1, "pre": 3, "int": 2, "wil": 4, "lore": "Rockboas swallow stones to weigh themselves down, and a dead one's belly holds a dozen smooth pebbles in a neat row."}, {"lineage": "Reptilia", "affinity": "Gaea", "archetype": "Skirmisher", "name": "Stoneskip", "form": "skink", "size": "medium", "sociality": "pack", "disposition": "benign", "move": "walk", "diet": "meat", "light": "shy of it", "sense": "smell", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 6, "end": 1, "pre": 1, "int": 4, "wil": 4, "lore": "Stoneskips lay their eggs among river stones, and the eggs are speckled grey and round enough to be mistaken for pebbles."}, {"lineage": "Reptilia", "affinity": "Gaea", "archetype": "Bulwark", "name": "Ankylith", "form": "armoured-lizard", "size": "large", "sociality": "solitary", "disposition": "benign", "move": "walk", "diet": "stone", "light": "shy of it", "sense": "tremor", "temper": "territorial", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 4, "agi": 4, "end": 6, "pre": 4, "int": 2, "wil": 1, "lore": "An Ankylith's plates are its meals turned to armour; the colour of each plate is the colour of the rock it ate that year, like the rings of a tree."}, {"lineage": "Reptilia", "affinity": "Gaea", "archetype": "Herald", "name": "Pebblecko", "form": "gecko", "size": "tiny", "sociality": "pack", "disposition": "benign", "move": "burrow", "diet": "meat", "light": "drawn to it", "sense": "tremor", "temper": "skittish", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 1, "agi": 2, "end": 1, "pre": 6, "int": 4, "wil": 3, "lore": "Pebbleckos are drawn to warm light, and they squeeze under the stones of a campfire ring; moving those stones in the morning scatters dozens."}, {"lineage": "Reptilia", "affinity": "Gaea", "archetype": "Arcanist", "name": "Geolisk", "form": "basilisk", "size": "medium", "sociality": "pack", "disposition": "benign", "move": "walk", "diet": "stone", "light": "drawn to it", "sense": "tremor", "temper": "territorial", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 1, "end": 1, "pre": 4, "int": 4, "wil": 4, "lore": "A Geolisk pack spreads out along a cave wall and each one presses its head to the stone, listening to the others through the rock."}, {"lineage": "Reptilia", "affinity": "Gaea", "archetype": "Warden", "name": "Ironback", "form": "tortoise", "size": "medium", "sociality": "solitary", "disposition": "hostile", "move": "walk", "diet": "stone", "light": "shy of it", "sense": "sight", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 2, "end": 2, "pre": 4, "int": 1, "wil": 6, "lore": "An Ironback eats rock that holds iron and sheds rust flakes as it walks; a trail of red flakes leads to an iron seam."}, {"lineage": "Reptilia", "affinity": "Aeth\u0113r", "archetype": "Brute", "name": "Sunstroke", "form": "lizard", "size": "medium", "sociality": "pair", "disposition": "benign", "move": "walk", "diet": "meat", "light": "shy of it", "sense": "smell", "temper": "skittish", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 6, "agi": 4, "end": 1, "pre": 3, "int": 1, "wil": 4, "lore": "A Sunstroke basks until it is too warm to move and then lies panting for an hour; crawlers can walk right past one that has overheated."}, {"lineage": "Reptilia", "affinity": "Aeth\u0113r", "archetype": "Skirmisher", "name": "Nova", "form": "drake", "size": "medium", "sociality": "pack", "disposition": "benign", "move": "fly", "diet": "meat", "light": "indifferent", "sense": "tremor", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 4, "end": 4, "pre": 1, "int": 2, "wil": 1, "lore": "Nova hatchlings are born able to fly and leave the nest the same day; the nest is abandoned so quickly that its eggshells are still warm."}, {"lineage": "Reptilia", "affinity": "Aeth\u0113r", "archetype": "Bulwark", "name": "Aurorasaur", "form": "drake", "size": "large", "sociality": "solitary", "disposition": "benign", "move": "fly", "diet": "light", "light": "drawn to it", "sense": "smell", "temper": "skittish", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 5, "agi": 3, "end": 6, "pre": 4, "int": 3, "wil": 1, "lore": "An Aurorasaur's scales are only coloured when light falls on them from above; seen from below, it is plain grey."}, {"lineage": "Reptilia", "affinity": "Aeth\u0113r", "archetype": "Herald", "name": "Flutter", "form": "gecko", "size": "tiny", "sociality": "solitary", "disposition": "benign", "move": "fly", "diet": "meat", "light": "drawn to it", "sense": "sight", "temper": "curious", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 3, "end": 1, "pre": 6, "int": 1, "wil": 1, "lore": "Flutters lay their eggs on the glass of lanterns, and a lantern left hanging in one place for a week comes down speckled with them."}, {"lineage": "Reptilia", "affinity": "Aeth\u0113r", "archetype": "Arcanist", "name": "Dazzlewyrm", "form": "basilisk", "size": "medium", "sociality": "solitary", "disposition": "hostile", "move": "fly", "diet": "light", "light": "drawn to it", "sense": "smell", "temper": "curious", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 2, "agi": 1, "end": 2, "pre": 1, "int": 6, "wil": 1, "lore": "A Dazzlewyrm's lair is dim for days after it has fed there, and the gloom it leaves is the only way to tell it has been."}, {"lineage": "Reptilia", "affinity": "Aeth\u0113r", "archetype": "Warden", "name": "Seraph", "form": "drake", "size": "medium", "sociality": "pack", "disposition": "benign", "move": "fly", "diet": "light", "light": "drawn to it", "sense": "sight", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 3, "agi": 3, "end": 1, "pre": 1, "int": 4, "wil": 5, "lore": "A Seraph pack circles a light in a slow ring, and the ring's size tells how bright the light is."}, {"lineage": "Reptilia", "affinity": "Erebos", "archetype": "Brute", "name": "Nightjaw", "form": "crocodile", "size": "medium", "sociality": "solitary", "disposition": "hostile", "move": "walk", "diet": "meat", "light": "shy of it", "sense": "sight", "temper": "territorial", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 5, "agi": 4, "end": 1, "pre": 1, "int": 2, "wil": 2, "lore": "A Nightjaw can hold its breath for an hour and lies at the bottom of a pool; its nostrils are the only part above the surface."}, {"lineage": "Reptilia", "affinity": "Erebos", "archetype": "Skirmisher", "name": "Muds e": "heat", "temper": "roamer", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 6, "agi": 1, "end": 5, "pre": 2, "int": 3, "wil": 2, "lore": "A Meteorant fell once; it bears a crater-scar on its back, and it walks back toward the spot where it landed every few years."}, {"lineage": "Lithic", "affinity": "Aeth\u0113r", "archetype": "Skirmisher", "name": "Selenite", "form": "crystal", "size": "large", "sociality": "pack", "disposition": "benign", "move": "walk", "diet": "stone", "light": "drawn to it", "sense": "smell", "temper": "roamer", "tame": "tameable", "lair": "wanders", "aberrant": null, "mgt": 4, "agi": 5, "end": 4, "pre": 2, "int": 3, "wil": 2, "lore": "A Selenite pack's glow waxes and wanes over a twenty-eight-day cycle, all of them together, wherever they are."}, {"lineage": "Lithic", "affinity": "Aeth\u0113r", "archetype": "Bulwark", "name": "Prismolith", "form": "crystal", "size": "huge", "sociality": "pair", "disposition": "benign", "move": "walk", "diet": "light", "light": "drawn to it", "sense": "sight", "temper": "ambusher", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 5, "agi": 4, "end": 6, "pre": 2, "int": 4, "wil": 2, "lore": "A Prismolith pair splits light into colours, and plants grow toward only one colour of the spread."}, {"lineage": "Lithic", "affinity": "Aeth\u0113r", "archetype": "Herald", "name": "Lumen", "form": "shard", "size": "tiny", "sociality": "solitary", "disposition": "benign", "move": "walk", "diet": "light", "light": "drawn to it", "sense": "smell", "temper": "territorial", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 1, "agi": 3, "end": 2, "pre": 5, "int": 4, "wil": 2, "lore": "A Lumen shard drifts toward the smell of oil, and it will climb into a lamp if the lid is left open."}, {"lineage": "Lithic", "affinity": "Aeth\u0113r", "archetype": "Arcanist", "name": "Lodestar", "form": "monolith", "size": "large", "sociality": "solitary", "disposition": "beneficial", "move": "walk", "diet": "light", "light": "shy of it", "sense": "tremor", "temper": "roamer", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 2, "agi": 2, "end": 5, "pre": 2, "int": 6, "wil": 4, "lore": "A Lodestar pulls iron toward it, and a hall where one rests is littered with nails and blade-tips drawn out of the dirt."}, {"lineage": "Lithic", "affinity": "Aeth\u0113r", "archetype": "Warden", "name": "Floating Facet", "form": "crystal", "size": "large", "sociality": "pack", "disposition": "benign", "move": "fly", "diet": "light", "light": "indifferent", "sense": "sight", "temper": "skittish", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 4, "agi": 2, "end": 5, "pre": 1, "int": 1, "wil": 6, "lore": "A Floating Facet pack turns to catch any light in the room and throw it back, so a lamp lit among them lights the whole hall."}, {"lineage": "Lithic", "affinity": "Erebos", "archetype": "Brute", "name": "Gravelem", "form": "golem", "size": "large", "sociality": "pack", "disposition": "hostile", "move": "walk", "diet": "carrion", "light": "indifferent", "sense": "smell", "temper": "curious", "tame": "wild", "lair": "keeps a lair", "aberrant": null, "mgt": 5, "agi": 3, "end": 3, "pre": 1, "int": 4, "wil": 4, "lore": "A Gravelem pack builds its bodies from grave-soil and the bones in it, and when one falls apart it leaves a burial behind."}, {"lineage": "Lithic", "affinity": "Erebos", "archetype": "Skirmisher", "name": "Hemolith", "form": "monolith", "size": "large", "sociality": "solitary", "disposition": "benign", "move": "walk", "diet": "blood", "light": "drawn to it", "sense": "sight", "temper": "roamer", "tame": "wild", "lair": "wanders", "aberrant": null, "mgt": 5, "agi": 5, "end": 3, "pre": 1, "int": 1, "wil": 1, "lore": "A Hemolith is porous and soaks up blood from the ground it walks on, turning a darker red with every battlefield it crosses."}, {"lineage": "Lithic", "affinity": "Erebos", "archetype": "Bulwark", "name": "Cenotaph", "form":
